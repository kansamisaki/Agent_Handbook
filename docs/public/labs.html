<script id="courseData" type="application/json">{"chapters": [{"id": 1, "group": "基础与模型", "title": "岗位地图与问题定义", "summary": "先明确要交付什么，再决定需要多少智能。你的后端经验会在权限、可靠性与系统集成上形成优势。", "sections": [{"title": "四类岗位，四种深度", "text": "应用 Agent 工程师把模型接入业务流程，负责工具、RAG、评测与用户体验；Agent 平台工程师负责运行时、状态、沙箱、多租户、观测和资源治理；推理基础设施工程师负责模型服务、GPU、吞吐与延迟；算法/研究工程师研究训练、规划、记忆、强化学习和基准。名称并不统一，投递时要看实际交付物。对你建议先以应用工程为主线，以平台能力形成差异化。"}, {"title": "什么时候需要 Agent", "text": "明确输入、固定规则、固定步骤的任务，优先程序或确定性工作流。需要根据新证据调整下一步、调用不同工具、跨多个回合完成目标时，Agent 更有价值。知识问答可能只需要 RAG；把查资料、诊断、生成工单和确认执行连接起来，才需要更完整的运行机制。自主程度应该与错误成本、可验证性和人工介入条件一起设计。"}, {"title": "把需求变成可检验的合同", "text": "以“内部故障处理助手”为例：输入是告警与服务名；允许读取监控和运行手册；输出是带证据的诊断与工单草案；写操作需要授权；超时转人工。先定义成功标准、禁止行为、数据范围、延迟预算、每次成功任务的成本，再选模型。不要把“回答得像专家”当作验收标准。"}, {"title": "知识深度的三个等级", "text": "P0：独立实现、测试、解释失败原因；P1：能设计方案、做小实验、判断何时采用；P2：知道边界、能读论文并按岗位深入。应用岗位不要求先精通 CUDA 与预训练集群，但必须知道模型接口背后的成本和限制。所谓全景，是理解系统各层及其关系，再选一个方向做深。"}], "exercise": "选一个你熟悉的 Java 业务，写一页 Agent 需求说明，列出 10 个正常任务、5 个异常任务、5 个必须转人工的任务。", "accept": "能用业务状态验证完成与否；每个工具有权限范围；存在明确的退出和降级条件。", "question": "为什么这个任务要用 Agent，固定工作流行不行？", "answer": "先列出运行中需要动态决策的环节；用固定工作流作基线，比较成功率、维护复杂度、延迟和成本。只有增益足以覆盖新增风险时才提高自主性。", "refs": ["jobs", "effective"], "tags": ["职业", "岗位", "需求", "workflow"], "priority": "P0"}, {"id": 2, "group": "基础与模型", "title": "LLM 原理与必要数学", "summary": "学到能解释模型为什么这样表现，并能做工程决策；算法岗位再继续深入推导。", "sections": [{"title": "从文本到下一个 Token", "text": "Tokenizer 把文本映射为 token 序列；token 不等于字或词，不同语言和模型的切分不同。Embedding 将 token 变成向量；Transformer 通过注意力和前馈网络更新表示；语言模型输出下一个 token 的概率分布。生成是反复采样或选择 token 的过程，因此流畅文字不能直接证明事实正确。"}, {"title": "需要掌握的数学", "text": "线性代数：向量、矩阵乘法、内积、余弦相似度、维度；概率统计：条件概率、期望、方差、置信区间、抽样偏差；微积分与优化：梯度、链式法则、梯度下降；信息论：交叉熵。先能解释 softmax 和 attention 的作用，再考虑手推反向传播。Attention(Q,K,V)=softmax(QKᵀ/√d)V；这是经典注意力形式，不代表所有现代架构都完全相同。"}, {"title": "训练、推理与对齐", "text": "预训练学习统计规律；SFT 用示例调整行为；偏好优化和强化学习进一步塑造输出。推理使用已经训练好的权重；把资料放进 prompt 不会直接更新模型参数。模型可以在上下文中使用新信息，但新会话是否知道它，取决于应用是否重新提供或外部系统是否存储。"}, {"title": "工程上必须懂的限制", "text": "上下文窗口是输入和生成预算的约束，具体计费与隐藏推理预算因接口而异。temperature 控制采样分布，不是可信度旋钮，0 也不承诺所有环境完全复现。幻觉来自多种因素，包括知识缺失、误解问题、证据不足和目标偏差。用可查证数据、工具结果和评测约束行为。"}], "exercise": "用 NumPy 实现余弦相似度和一个小型 attention 计算；比较中文、代码、JSON 的 token 数；同一任务重复运行 10 次记录波动。", "accept": "解释向量维度、余弦相似度与概率的区别；能区分上下文学习、长期记忆和参数更新。", "question": "为什么相似度 0.9 不能解释为答案有 90% 概率正确？", "answer": "向量相似度衡量表示空间中的接近程度，受模型和数据分布影响；正确概率需要专门定义事件、收集标签并校准。", "refs": ["transformer"], "tags": ["token", "Transformer", "数学", "embedding"], "priority": "P0"}, {"id": 3, "group": "基础与模型", "title": "模型选型、提示词与结构化输出", "summary": "选择模型要看你的任务分布；提示词、工具合同和验收器要共同工作。", "sections": [{"title": "建立自己的选型矩阵", "text": "比较任务成功率、工具调用可靠性、结构化输出、长上下文、语言与多模态能力、时延、限流、数据部署条件和成本。用相同输入、相同工具、同一评测集对比多个模型。不要把公开榜单名次直接当作企业业务效果，也不要把所有任务都交给成本最高的模型。"}, {"title": "提示词是一份运行说明", "text": "清晰说明角色、目标、输入范围、允许的工具、输出格式、停止条件和少量代表性例子。动态证据与固定规则分开组织；外部文档明确标为数据。记录 prompt 版本并做回归。长篇角色扮演通常不如明确任务合同有用，程序可以确定的条件应由程序验证。"}, {"title": "结构化输出的边界", "text": "JSON Schema/Pydantic/Java record 约束形状，业务校验约束意义。即使输出符合 schema，订单号仍可能不存在、金额仍可能越权。支持严格约束的接口也要处理拒答、截断、不支持的 schema 和工具失败。解析失败时做有限修复或返回可处理错误，不无限要求模型重试。"}, {"title": "路由与降级", "text": "可以用便宜模型做分类、强模型处理复杂诊断，但路由本身也会出错，需要测漏分率。降级模型必须通过关键能力和权限测试；某个供应商故障时，不应把隐私条件或工具权限悄悄放宽。保存模型标识、参数、prompt 和工具 schema 版本，才有可解释的对比。"}], "exercise": "设计一个故障分类 schema：category、severity、evidence_ids、needs_human；为无证据、截断、非法枚举和业务越权各写一个案例。", "accept": "无论模型返回什么，业务端都不会接受不存在的资源或越权动作；有两种模型的同集对比。", "question": "JSON 都正确了，为什么还要评测？", "answer": "格式约束只保证可解析性。仍需验证事实、证据对应关系、业务正确性、权限和任务终态。", "refs": [], "tags": ["prompt", "schema", "选型", "routing"], "priority": "P0"}, {"id": 4, "group": "Agent 核心", "title": "Context Engineering：每轮让模型看到什么", "summary": "上下文是一个有预算的数据包，需要选择、压缩、排序和更新。", "sections": [{"title": "一轮上下文的组成", "text": "通常包含系统规则、用户目标、工具描述、当前任务状态、近期对话、检索证据、必要记忆和输出预算。任务运行状态应有结构化真源；不要只靠一大段聊天记录推断已经做过什么。真正的问题是：当前决策需要什么信息，哪些信息过期、冗余或不可信。"}, {"title": "预算与组装流程", "text": "先为输出和必要协议开销留空间，再放不能丢的规则与目标，然后放相关证据和近期消息。估算 token 后用实际 tokenizer 或服务端 usage 校验。超预算时按策略处理：裁剪冗余、摘要、分页读取、按需加载工具；不能任意截断一半 JSON 或把 tool_call 与对应结果拆开。"}, {"title": "压缩并不等于无损", "text": "摘要可能丢掉否定条件、时间、单位和证据来源。把关键业务约束、已授权操作、未解决问题保留为结构化字段；长工具结果放对象存储，仅传摘要与可读取的引用。对摘要做事实一致性抽检，并比较压缩前后任务成功率。"}, {"title": "延迟加载与缓存", "text": "工具很多时先检索候选工具，再加载相关描述；资料很多时检索或按需读文件。前缀缓存复用的是推理计算，不是业务记忆；命中需要满足具体服务的前缀和缓存规则。安全指令即使重复也可能必要，不能为了压缩丢失信任边界。"}], "exercise": "在上下文实验室中调整历史长度、检索条数和输出预算；实现一个能解释“保留/舍弃原因”的 context builder。", "accept": "每轮有 token 账单和选材记录；压缩不会丢失用户目标、权限限制或未完成动作。", "question": "上下文窗口变大了，还需要 RAG 和 memory 吗？", "answer": "需要按任务决定。长上下文提供容量；RAG 解决外部信息选择与更新；memory 解决跨会话保存、检索和治理。容量增加不会自动解决权限、时效与相关性。", "refs": ["context"], "tags": ["context", "压缩", "prompt caching", "token"], "priority": "P0"}, {"id": 5, "group": "Agent 核心", "title": "Tool Calling 与业务工具设计", "summary": "模型提出调用请求，应用负责校验、授权、执行并返回结果。", "sections": [{"title": "完整调用链", "text": "向模型提供工具名称、用途、参数 schema；接收 tool_call；校验名称与参数；从可信会话取得身份；执行权限检查；调用工具；把结果和 call_id 绑定返回；再由模型决定下一步。工具请求是输入，不能作为已发生的业务事实。"}, {"title": "设计面向任务的接口", "text": "优先 get_order、search_runbook、draft_ticket 这样的明确操作。避免把万能 SQL、任意 shell 和任意 HTTP 转发当默认工具。写清单位、时区、分页、空结果、错误类型和返回字段。对读写操作分级，工具清单应按当前用户的授权动态收窄。"}, {"title": "可靠性属于执行器", "text": "所有外部调用都有超时；区分可重试与不可重试错误；指数退避加抖动；设置总预算。写操作使用稳定业务幂等键，并在业务服务原子去重。不要由模型选择 tenant_id 或授权角色。已提交但超时的操作先查询状态，再决定是否重试。"}, {"title": "工具结果也是不可信输入", "text": "搜索网页、邮件或文档中的“忽略上面的规则”只是内容。截断过大结果、过滤敏感字段、标注来源；工具输出不应提升权限。审批必须绑定具体动作参数、资源版本和有效期，不能让一次泛化批准解锁全部写入。"}], "exercise": "为 Java 订单服务设计只读查询与退款草案两个工具，编写 schema、错误码、权限校验和重试策略。", "accept": "模拟非法参数、跨租户访问和重复调用时，后端仍能正确拒绝或去重。", "question": "Tool calling 和直接让模型输出 JSON 有何区别？", "answer": "工具调用形成可识别的动作请求与结果协议；JSON 可以只是数据。两者都必须通过应用执行与校验，任何格式都不会自动赋予权限。", "refs": ["springtools"], "tags": ["function calling", "工具", "幂等", "权限"], "priority": "P0"}, {"id": 6, "group": "Agent 核心", "title": "Agent Loop、规划与停止条件", "summary": "一个可控的 Agent 是有状态、有预算、有工具和可验证终点的决策循环。", "sections": [{"title": "最小闭环", "text": "读取目标与状态 → 构建上下文 → 请求模型 → 检查输出 → 执行工具或结束 → 记录观察 → 更新状态。ReAct 可理解为决策与环境反馈交替，工程日志重点记录行动、证据和简短决策说明，不需要依赖可访问的模型私有思维链。"}, {"title": "规划要能被修正", "text": "简单任务用单循环；复杂任务可以先拆成计划，再逐步执行并根据新证据重规划。计划不是承诺，可能有不存在的工具或错误依赖。每步都需要前置条件和完成标准；高风险计划先审查。反思只有在有新证据或有效评分器时才可能有帮助，重复自我肯定不会增加真实性。"}, {"title": "停止比继续同样重要", "text": "完成、缺信息、被拒绝、预算耗尽、工具不可用、用户取消都应成为明确终态。限制总步数、总耗时、token、费用和重复动作次数。对“相同参数重复检索”“无新证据仍继续规划”做循环检测，并提供可读的部分结果。"}, {"title": "框架与手写如何选择", "text": "先手写一个小循环，理解消息协议和副作用；再用有状态编排框架解决 checkpoint、分支、恢复等需求。框架节省基础工作，但不代替你设计权限、业务幂等和评测。对抽象的理解应落实到：哪一层持有状态，哪一层真正执行工具。"}], "exercise": "实现最大 6 步的 runbook 助手；至少覆盖正常完成、无证据、工具超时、用户取消四种终态。", "accept": "能够在任一步解释输入状态、调用、结果和下一状态；达到预算会停止并返回原因。", "question": "为什么给 Agent 无限次数反思可能更差？", "answer": "费用和错误会累积，输出可能被先前错误带偏。只有反思能引入新证据、有效验证或纠错动作时才有价值，仍需预算。", "refs": ["effective"], "tags": ["ReAct", "planning", "reflection", "harness"], "priority": "P0"}, {"id": 7, "group": "Agent 核心", "title": "状态机、Checkpoint 与持久化运行", "summary": "将一次对话升级为能暂停、恢复、审计的任务。", "sections": [{"title": "状态应显式建模", "text": "run_id 标识一次执行，thread_id 标识会话，tenant_id/user_id 来自可信身份，state 保存任务目标、步骤、证据引用、待审批动作、预算和版本。消息历史是状态的一部分，不是全部。任务可处于 queued、running、waiting_approval、succeeded、failed、cancelled 等状态。"}, {"title": "Checkpoint 与业务提交不同", "text": "Checkpoint 保存编排进度，业务数据库保存真实副作用。若业务写入已成功但 checkpoint 前崩溃，恢复后可能重放同一工具调用。持久化运行不能自动跨系统保证 exactly-once；需要业务幂等、结果查询、事务 outbox 或补偿机制协调。"}, {"title": "恢复、重放与版本", "text": "重放要控制非确定性。持久化已得到的模型结果与工具结果；把外部副作用放在受控执行单元中。恢复旧任务时，要处理 schema、prompt、工具和代码版本兼容；不能假设升级后旧状态一定可读。用乐观锁或状态版本阻止两个 worker 同时推进同一个 run。"}, {"title": "人工介入不是阻塞线程", "text": "进入待审批状态，持久化具体待办并释放 worker；收到审批事件后校验身份、参数摘要、资源版本和有效期，再恢复。用户取消后传播取消信号，同时说明已完成的外部操作通常不能靠取消自动撤销。"}], "exercise": "在工具返回后、checkpoint 写入前故意终止进程，再恢复任务，观察有无重复工单。", "accept": "重复消息和 worker 重启不产生重复副作用；审批等待期间不占用长时间运行的请求线程。", "question": "LangGraph 或 Temporal 能保证写操作只执行一次吗？", "answer": "不能仅凭使用框架就承诺。恢复与重试可能重放执行，外部系统必须支持业务级幂等或事务协调，并验证崩溃窗口。", "refs": ["persistence", "temporal"], "tags": ["state", "checkpoint", "durability", "恢复"], "priority": "P0"}, {"id": 8, "group": "记忆与知识", "title": "Memory 全景：状态、记忆、知识与缓存", "summary": "先区分“存了什么、为谁存、何时读、谁能删”，再考虑向量数据库。", "sections": [{"title": "六种容易混淆的东西", "text": "工作状态保存当前任务；短期记忆保存会话相关历史；长期记忆保存跨会话的偏好和事实；外部知识库保存文档；模型权重保存训练得到的统计规律；KV/prompt cache 保存计算中间结果。它们可能互相配合，却有不同的生命周期、权限和更新方式。"}, {"title": "长期记忆的内容类型", "text": "语义记忆是事实与偏好，例如用户偏好中文；情景记忆是发生过的任务及结果，例如上次排查某故障的步骤；程序性记忆是可复用的流程或操作规则。分类是设计辅助，并非所有框架都使用同一套名称。不要把未经审核的用户文本变成高权限系统规则。"}, {"title": "记忆是一条数据管道", "text": "候选抽取 → 判断是否值得记住 → 可信度与敏感性检查 → 与旧事实去重/冲突处理 → 持久化 → 按身份与任务检索 → 注入上下文 → 根据反馈更新/过期/删除。存得越多不一定越好，错误记忆会在后续会话不断放大。"}, {"title": "与后端经验对应", "text": "可以把记忆系统理解为有来源、版本、作用域和过期机制的业务数据服务。PostgreSQL 适合规范事实与事务；向量索引适合语义召回；Redis 适合短期缓存。聊天日志、向量数据库和记忆产品不是同义词。"}], "exercise": "将“本次查询订单 123”“我更喜欢中文”“上周故障复盘”“模型 KV cache”分配到不同存储，并说明保留多久。", "accept": "能分别回答运行状态、用户偏好、知识文档、计算缓存丢失后会发生什么。", "question": "把所有聊天写入向量数据库，等于做好 memory 吗？", "answer": "只完成了部分存储和召回。还缺写入准入、事实冲突、身份隔离、时效、删除传播以及对记忆是否有益的评测。", "refs": ["memory"], "tags": ["memory", "短期记忆", "长期记忆", "KV cache"], "priority": "P0"}, {"id": 9, "group": "记忆与知识", "title": "Memory 工程：写入、冲突、检索和遗忘", "summary": "一条记忆应该能被追溯、纠正、过期和删除。", "sections": [{"title": "一个可用的数据模型", "text": "建议字段：memory_id、tenant_id、user_id、scope、kind、key、value、source_ref、confidence、valid_from、expires_at、version、status。这里的 confidence 是系统评分，不应冒充校准概率。将事实与原始证据关联，避免把模型推测当成用户确认。"}, {"title": "处理矛盾和更新", "text": "“之前喜欢邮件，现在改为站内通知”属于时间演变；不同项目的偏好可能同时成立。按作用域、来源可靠性、事件时间、版本做决策。明确更正可替换旧值；不确定冲突应保留候选并询问。不能只按向量距离或最新写入时间无条件覆盖全部事实。"}, {"title": "检索时先处理权限", "text": "从可信身份计算可访问范围，再进行关键词/向量召回、去重、重排和时效过滤。相关性评分可结合语义、最近使用、来源和任务匹配，但权重需要用数据验证。读取后可标注“这是历史偏好”，避免其覆盖用户当前明确指令。"}, {"title": "遗忘和评测", "text": "TTL 适合临时信息；长期偏好应支持用户查看和更正。删除必须覆盖主库、索引、缓存和派生摘要，并按照既定保留策略处理备份。评测要包含应记住、不应记住、跨用户、过期、矛盾更新和删除后查询；观察有记忆相对无记忆的真实收益。"}], "exercise": "实现偏好记忆服务，给两名用户设置不同偏好，加入冲突更正、TTL 和删除测试。", "accept": "跨用户泄漏为 0；过期事实不注入；同一事实更新可审计；删除能影响检索和缓存。", "question": "Memory 让成功率下降，先查哪里？", "answer": "先查错误写入、过期/越权召回、与当前指令冲突和上下文拥挤。对比关闭写入、关闭检索、仅显式偏好等消融，再决定修改哪一层。", "refs": ["memory"], "tags": ["memory", "TTL", "冲突", "遗忘", "多租户"], "priority": "P0"}, {"id": 10, "group": "记忆与知识", "title": "RAG 数据工程：从文件到可引用证据", "summary": "RAG 的下限由数据质量、更新链路和权限元数据决定。", "sections": [{"title": "离线摄入流程", "text": "连接数据源 → 增量抓取 → 文本/表格/OCR 解析 → 清洗与结构恢复 → 文档分块 → embedding → 建索引。保存 document_id、版本、页码/段落、标题层级、更新时间、来源 URL 和 ACL。扫描 PDF、表格和代码需要不同解析策略，不能只把所有文件转成一串文本。"}, {"title": "分块的取舍", "text": "小块定位精细但丢失上下文；大块信息完整但噪声和 token 成本上升。按标题、段落、代码符号和语义边界分块，并在检索后按需取父段或邻段。overlap 可能保留连接信息，也会制造重复。块大小应通过任务集选择，而不是背一个固定数字。"}, {"title": "增量、删除与版本", "text": "用内容 hash 和源版本避免重复处理；embedding 模型升级通常需要重建或双写新索引；删除和权限变更必须传播。旧文档与新文档共存时，检索要明确“当前有效版本”。保留原文和解析版本，才能定位答案错误来自解析、检索还是生成。"}, {"title": "证据到答案", "text": "检索结果应带稳定引用 ID；生成回答使用这些 ID；服务端核验引用存在且来自授权上下文，再检查关键结论是否被证据支持。找不到证据时应澄清或说明不足，不能给不存在的链接。RAG 降低部分知识缺失问题，不保证回答必然正确。"}], "exercise": "用 30 份运行手册和变更记录构建知识库，故意加入扫描件、重复版本、表格和被撤权文档。", "accept": "每段答案能追溯到原文位置；更新/删除可验证；有解析失败和索引滞后的监控。", "question": "RAG 答错了，怎么定位？", "answer": "依次检查原始数据是否有答案、解析是否保留、候选是否召回、重排是否选中、上下文是否完整、生成是否忠于证据。每层应有独立样本和指标。", "refs": ["rag"], "tags": ["RAG", "chunking", "OCR", "数据管道"], "priority": "P0"}, {"id": 11, "group": "记忆与知识", "title": "检索系统：Hybrid、Rerank 与搜索评测", "summary": "检索要同时照顾语义表达、精确标识、权限和排序质量。", "sections": [{"title": "关键词和向量互补", "text": "BM25 擅长精确词项、错误码和产品名；稠密向量擅长语义相近表达。混合检索可以融合两者，常用排名融合如 RRF：Σ 1/(k+rank)。不要直接相加尺度不同的 BM25 分数和余弦值。教学实验采用固定归一化玩具分数，真实系统需要校准或按排名融合。"}, {"title": "召回与重排分工", "text": "召回阶段快速找到候选；cross-encoder 或其他 reranker 对 query-document 进行更细判断；再做去重、多样性选择和上下文装配。rerank 不能找回候选集中不存在的资料。Query rewrite、multi-query、HyDE 和 GraphRAG 只在能解决已观察问题时引入，额外调用也有成本。"}, {"title": "索引与过滤", "text": "精确检索容易理解；HNSW/IVF 等近似索引用空间或召回换速度。评估向量维度、规模、更新频率、过滤选择性和尾延迟。权限必须在可信服务端约束，不能先把未授权内容发给模型再要求它忘记；近似索引结合过滤的召回行为需要实测。"}, {"title": "指标要对准失败层", "text": "Recall@k 看相关证据是否进候选；Precision@k 看候选噪声；MRR 看首个相关结果位置；nDCG 适合分级相关性；最终答案还要测证据支持和任务成功。业务长尾、同义词、错误码、空答案、跨权限、时间敏感问题都应进入评测集。"}], "exercise": "构造 50 个带相关文档标签的问题，比较 BM25、向量、混合、混合加重排四个版本。", "accept": "报告各版本 Recall@k、延迟和 token 成本，并展示至少 5 个失败例；不只报平均准确率。", "question": "为什么向量召回很好，端到端仍然差？", "answer": "相关证据可能被重排丢弃、分块割裂、版本过期或与噪声混在一起，生成模型也可能忽略或曲解证据。需要分层追踪。", "refs": ["pgvector", "rag"], "tags": ["BM25", "HNSW", "rerank", "hybrid", "GraphRAG"], "priority": "P0"}, {"id": 12, "group": "Agent 核心", "title": "Workflow 与 Multi-agent：组织多个决策单元", "summary": "多 Agent 的价值来自分工、隔离与并行，收益必须超过协调成本。", "sections": [{"title": "常用编排模式", "text": "顺序链用于阶段清楚的任务；路由根据输入选择处理路径；并行用于独立子任务；评估器—优化器用于可评分的迭代；planner-worker 用于动态拆解。先画依赖图，区分哪些步骤由代码确定、哪些由模型决定。固定业务审批用状态机表达更容易审计。"}, {"title": "什么时候值得多 Agent", "text": "多个独立研究主题、不同权限域或上下文相互干扰时，可以拆分执行单元。单个短任务一般无需设置十几个角色。多 Agent 会增加消息成本、延迟、版本管理和故障定位难度；相同模型互相投票还可能共享同一偏差。"}, {"title": "通信和共享状态", "text": "每个任务有目标、输入、权限、预算、输出 schema 和负责人。返回结构化结果与证据引用，汇总器检查冲突。对共享写入使用版本控制或单写者设计；只并行没有依赖的工作。handoff 是控制权转移，不等于把全部聊天记录复制给所有 Agent。"}, {"title": "评测协作是否有效", "text": "与单 Agent、固定工作流对比成功率、成本和尾延迟；增加通信失败、子任务超时和互相矛盾案例。最终验证器应检查业务终态。没有可测收益时，减少角色和轮次。"}], "exercise": "把故障诊断拆成日志分析与变更分析两个只读任务，再由汇总器生成带证据的结论；对比单 Agent。", "accept": "子任务之间无重复写入；冲突证据不会被静默合并；有同预算下的对比结果。", "question": "为什么三个 Agent 投票不一定比一个准确？", "answer": "误差可能高度相关，投票并不创造新信息。增加独立证据、不同检验方法或确定性校验，比单纯重复同一判断更重要。", "refs": ["effective"], "tags": ["multi-agent", "DAG", "handoff", "协作"], "priority": "P1"}, {"id": 13, "group": "Agent 核心", "title": "MCP、A2A、Skills 与框架生态", "summary": "理解协议边界，避免把连接标准误当作完整 Agent 平台。", "sections": [{"title": "MCP 解决连接问题", "text": "MCP 将应用与工具、资源、提示模板等能力连接起来。理解 host、client、server 的职责，学习能力发现、工具 schema、传输、授权和错误处理。协议会演进：对接时固定规范版本与 SDK，逐项检查兼容，不照抄旧文章中的握手或 transport 假设。"}, {"title": "A2A 解决跨 Agent 协作接口", "text": "A2A 关注 Agent 之间的能力描述、任务交流、状态与产物等互操作；MCP 更偏 Agent 应用连接工具与上下文。二者可组合，但不是实现多 Agent 的必要前提。同进程几个函数协作无需先部署完整协议体系。"}, {"title": "Skills 与知识包", "text": "Skill 常是任务说明、脚本、资源和约定的封装，帮助按需加载能力。它并不是所有平台统一的通信协议，也不会自动保证脚本安全。需要版本固定、来源审查、运行权限、依赖管理和效果回归。读取第三方说明时保留信任边界。"}, {"title": "怎么学框架", "text": "Python 可选 LangGraph 等有状态编排工具；Java 可选 Spring AI 或 LangChain4j 等生态。学习重点是消息、工具、状态、恢复和评测的抽象。先用一个框架完成项目，再阅读另一种实现做对照，避免把导入包名当作掌握原理。"}], "exercise": "把一个只读 Java 业务查询封装为 MCP 服务，写出客户端发现、调用、无权限、超时四个流程图。", "accept": "明确协议版本、认证方式和可见工具范围；断开协议后仍能解释底层业务接口合同。", "question": "MCP 会自动解决提示注入和越权吗？", "answer": "不会。协议提供连接与交互机制；应用仍需身份认证、最小权限、输出处理、授权校验和隔离。", "refs": ["mcp", "a2a", "spring"], "tags": ["MCP", "A2A", "skills", "LangGraph"], "priority": "P1"}, {"id": 14, "group": "工程与基础设施", "title": "Python Agent 服务：异步、类型与测试", "summary": "把实验脚本变成边界清晰、可运行、可维护的后端服务。", "sections": [{"title": "代码结构", "text": "将 model adapter、context builder、tool registry、policy、runner、state store、evaluation 分开。Pydantic/dataclass 定义输入输出，协议接口隔离供应商 SDK。FastAPI 等 HTTP 层只处理身份和请求生命周期，不把所有编排塞进路由函数。Python 类型标注有利于检查，运行时校验仍要显式执行。"}, {"title": "并发与取消", "text": "asyncio 适合网络 I/O；CPU 密集解析或 embedding 任务按资源放进进程或专用服务。理解 task、await、semaphore、timeout 和取消传播；限制模型与工具并发，避免无界 gather。同步 SDK 在异步路由里可能阻塞事件循环。"}, {"title": "配置与依赖", "text": "环境变量或 secret manager 管理凭证；配置分环境并校验必需字段；固定依赖和模型接口版本。日志避免原样输出密钥、完整私人对话。开发机、本地容器与线上环境都应使用可追溯的构建产物。"}, {"title": "测试策略", "text": "对 schema、策略、幂等、状态转换写确定性测试；外部服务用契约测试与可控 mock；端到端用真实模型跑小型稳定评测集。录制回放可节省费用，但也可能掩盖接口漂移。Mock 全绿只证明你与 mock 一致，不能证明模型实际会正确调用工具。"}], "exercise": "将脚本拆成 HTTP 创建任务、后台执行、查询状态三个接口，加并发限制和用户取消。", "accept": "慢工具不会阻塞全部请求；服务重启后任务状态可查；关键错误返回结构化错误码。", "question": "Python 的 async 为何不一定让模型调用更快？", "answer": "它主要提高 I/O 等待期间的并发利用率；单个远程推理耗时未必降低，过高并发还会触发限流、排队和更差尾延迟。", "refs": [], "tags": ["Python", "asyncio", "FastAPI", "testing"], "priority": "P0"}, {"id": 15, "group": "工程与基础设施", "title": "Java / Spring 业务系统如何接入", "summary": "保留你熟悉的后端能力，把模型放在受控的业务边界中。", "sections": [{"title": "两种合理架构", "text": "Java 单栈：Spring Boot 加模型客户端/工具调用框架，适合已有团队和业务集成；双栈：Java 管身份、交易和业务工具，Python 管快速迭代的 Agent 编排，通过 HTTP/gRPC/消息协作。双栈增加部署、版本、追踪和故障面，不是默认更先进。"}, {"title": "服务端是权限真源", "text": "用户身份由网关验证并安全传递；业务服务再次检查资源权限；tenant_id 与 operator_id 来自认证上下文。模型只提供业务参数，不能自行指定角色。Java service 层校验库存、状态流转、额度和资源版本，工具注解不能取代这些规则。"}, {"title": "事务、幂等与异步", "text": "数据库事务只能覆盖自己的事务边界；模型请求和远程工具调用不应持有长事务。采用“创建意图/草案 → 审批 → 短事务提交”的流程。以稳定 action_id 加唯一约束去重；需要可靠发事件时考虑 outbox；补偿操作要有业务语义。"}, {"title": "Java 学习补充", "text": "熟悉 Spring AI 中模型、工具、memory 和 observability 的职责；需要时对比 LangChain4j。关注 WebFlux/CompletableFuture/虚拟线程与真实阻塞行为；SSE 的连接超时、代理缓冲和断线恢复也要验证。框架文档随版本变化，示例工程必须固定 BOM 和 SDK。"}], "exercise": "让 Python Agent 调用 Java 的查询服务和“创建工单草案”服务，传递 trace_id 与稳定 action_id，权限由 Java 独立校验。", "accept": "同一个 action_id 重试返回同一工单；篡改 tenant_id 无效；跨服务 trace 能连起来。", "question": "为什么不把数据库凭证直接交给 Agent？", "answer": "业务 API 能收窄权限、限制字段和执行规则。直接数据库访问扩大攻击面，也容易绕过行级权限、审计和状态机；特定只读分析场景应单独隔离。", "refs": ["spring", "springtools"], "tags": ["Java", "Spring Boot", "Spring AI", "事务"], "priority": "P0"}, {"id": 16, "group": "工程与基础设施", "title": "服务层：API、流式输出与长任务", "summary": "用户交互、后台执行和真实业务动作需要分开建模。", "sections": [{"title": "任务型 API", "text": "POST /runs 创建执行并返回 run_id；GET /runs/{id} 查询；GET /runs/{id}/events 流式接收；POST /runs/{id}/cancel 请求取消；审批接口接收针对具体 action 的决定。创建接口本身也可支持幂等键。不要把一次几十分钟的执行绑在单个 HTTP 请求上。"}, {"title": "事件流合同", "text": "SSE 适合服务器单向推送；WebSocket 适合双向实时交互。事件包含 event_id、run_id、type、timestamp 和 payload。区分文本增量、工具开始、工具结果、等待审批、完成和错误。重连可按事件游标补发，消费者按 event_id 去重，不能把重复流事件当作再次执行的命令。"}, {"title": "队列与资源治理", "text": "有界队列、租户配额、worker 池和超时共同约束负载。消息至少一次投递意味着可能重复消费；消费端必须幂等。长任务使用租约/心跳检测失联；重试有上限，无法处理的任务进入死信或人工处置。"}, {"title": "交互上的真实状态", "text": "展示“检索了哪些来源、正在等待哪个工具、是否需要确认”，不要伪造进度百分比和思考过程。文本已经开始输出不代表业务完成；工具请求成功提交也不代表执行成功。前端按服务端终态更新，不从模型措辞猜状态。"}], "exercise": "实现可重连的 SSE 任务流，运行中断网后恢复，确保没有丢失最终状态或触发重复写入。", "accept": "能区分取消请求已收到与实际任务已停止；断线重连后事件完整、有序或可按序重组。", "question": "为什么不能用模型输出“已完成”作为订单成功依据？", "answer": "输出可能错误或早于提交。订单成功应读取业务系统确认的状态，并绑定订单 ID 和版本。", "refs": [], "tags": ["SSE", "WebSocket", "队列", "API"], "priority": "P0"}, {"id": 17, "group": "工程与基础设施", "title": "数据与平台 Infra：租户、存储与隔离", "summary": "基础设施的任务是把一次成功演示变成可持续服务。", "sections": [{"title": "不同数据放在哪里", "text": "关系数据库保存 run、step、action、approval、memory 和元数据；对象存储保存文件、长工具结果和产物；向量/搜索引擎保存检索索引；缓存保存可重建的加速数据；队列协调异步任务。先从 PostgreSQL 加对象存储和必要队列做起，复杂度由真实负载驱动。"}, {"title": "多租户与访问控制", "text": "tenant_id 应贯穿状态、memory、检索、对象路径、缓存键和 trace。RBAC 适合角色授权，ABAC 可结合资源属性。行级隔离、服务端过滤和工具级范围共同保护数据；检索索引和缓存也会发生越权，不能只检查主数据库。"}, {"title": "执行隔离与沙箱", "text": "代码 Agent 可能执行不可信代码，需要隔离文件系统、网络、进程、凭证和资源。容器是基础组件，不自动等于强隔离沙箱；根据威胁模型选择更强隔离方式。设置 CPU、内存、时长、磁盘和网络出口限制，短期凭证按任务注入。"}, {"title": "平台控制面与执行面", "text": "控制面管理配置、权限、工具目录、预算和版本；执行面运行任务、调用模型与工具、发送事件。两者分离有助于治理，但小项目可先以模块划分。平台岗位还要考虑公平调度、租户噪声、限额、账单归因和资源回收。"}], "exercise": "设计一张多租户数据流图，标出每个存储的 tenant 隔离方式、删除路径和备份恢复方案。", "accept": "两个租户使用相同问题、相同业务 ID 时不会共享未授权缓存或记忆；沙箱不能读取宿主密钥。", "question": "为什么 Redis key 只用 question hash 会出问题？", "answer": "不同用户可能问相同问题但拥有不同权限或数据。缓存键及读取校验必须体现租户、权限范围、数据版本等条件。", "refs": [], "tags": ["infra", "多租户", "PostgreSQL", "sandbox"], "priority": "P0"}, {"id": 18, "group": "工程与基础设施", "title": "推理 Infra：GPU、KV Cache 与吞吐", "summary": "应用工程师要理解性能来源；推理岗位需要进一步实测与优化底层系统。", "sections": [{"title": "Prefill 与 Decode", "text": "Prefill 处理输入上下文；decode 逐步生成输出。长输入主要增加 prefill 工作与 KV 占用，长输出延长 decode。区分 TTFT（首 token 延迟）、TPOT（输出 token 间隔）、端到端延迟、吞吐和排队时间；只看 tokens/s 会掩盖用户等待。"}, {"title": "显存由哪些部分构成", "text": "权重粗估为参数量×每参数字节；还需要 KV cache、激活、运行时和碎片空间。对标准全注意力 KV 存储，粗估 bytes=2×层数×KV头数×头维度×缓存 token 数×每元素字节×并发序列数。GQA 使用 KV 头数而非查询头数；滑窗、压缩和混合架构需要另算。"}, {"title": "常见优化与取舍", "text": "连续批处理提高利用率但影响延迟；分页 KV 管理减少浪费；prefix caching 复用共同前缀的计算；量化降低权重或 KV 内存但可能影响质量；speculative decoding 用草稿与验证加速，收益取决于接受率和实现。缓存不等于免除全部输出计算。"}, {"title": "服务与规模化", "text": "可以用托管 API 起步；自托管需要评估硬件、运维、可用性、数据条件和总拥有成本。vLLM/SGLang 等属于服务与执行生态；深入方向包括 tensor/pipeline/data parallel、NCCL 通信、KV 迁移、prefill/decode 分离、CUDA/Triton、性能剖析。应用岗位先会压测和预算，推理岗位再深入这些细节。"}], "exercise": "用显存实验室改变上下文、并发、KV 头数和精度；在可用环境测短/长输入输出的 TTFT 与吞吐。", "accept": "能解释为什么“权重放得下”不等于“服务跑得稳”；压测报告记录硬件、模型、精度、请求分布和并发。", "question": "prefix caching 会同比减少所有推理延迟吗？", "answer": "不会。它主要复用相同前缀的计算；decode、未命中部分、排队和工具耗时仍然存在。实际收益受命中率和工作负载影响。", "refs": ["vllm"], "tags": ["GPU", "vLLM", "KV cache", "batching"], "priority": "P1"}, {"id": 19, "group": "质量与治理", "title": "Evaluation：把“感觉不错”变成证据", "summary": "Agent 的质量要看真实结果、轨迹、成本与风险，不能只看一段回答。", "sections": [{"title": "分层评测", "text": "组件层测检索、参数、schema 和权限；轨迹层测工具选择、重复调用、恢复与预算；结果层测业务终态；用户层测任务完成和人工接管。对写操作读取数据库或沙箱终态，不用模型自述打分。把“安全地拒绝不应执行的任务”也定义为成功。"}, {"title": "数据集建设", "text": "从真实任务分布抽取并脱敏，包含正常、长尾、无答案、越权、注入、超时和冲突案例。开发集用于调试，保留集用于最终比较；按时间、用户或文档隔离，避免相似样本泄漏。合成案例补边界，不能完全取代真实失败。"}, {"title": "评分器与统计", "text": "可确定验证的部分优先规则、单测和终态校验；语义质量可由人工或 LLM judge 辅助。Judge 需用人工样本校准，打乱答案顺序并观察风格偏差。报告样本数、重复次数、失败切片和不确定性；单次 20 题高分不能证明普遍可靠。"}, {"title": "pass@k、可靠性与消融", "text": "pass@k 衡量多次尝试中至少一次成功，和每次都可靠不是一回事。需要区分尝试次数、采样策略与成本。做消融：移除 memory、rerank、规划或更换模型，定位真正贡献。上线前定义门禁，安全回归不能被平均分掩盖。"}], "exercise": "建立至少 50 个任务的小评测集，固定工具环境，对 A/B 两版本重复跑 3 次，按失败类型汇总。", "accept": "每条案例有输入、初始状态、允许动作、成功条件、评分器和版本；报告可复现，不只给总分。", "question": "让另一个大模型给答案打分，足够吗？", "answer": "不够。它可能共享偏差、偏爱冗长风格或被输出诱导；事实和副作用应用外部真源验证，语义评分需人工校准。", "refs": ["evals"], "tags": ["eval", "judge", "pass@k", "benchmark"], "priority": "P0"}, {"id": 20, "group": "质量与治理", "title": "Observability 与成本：从一次失败追到根因", "summary": "把运行事件、模型行为和业务结果连接起来，才能优化。", "sections": [{"title": "Trace 的层级", "text": "request/run → model call → retrieval/tool call → business API。统一 trace_id、run_id、step_id，记录开始结束、状态、错误类、版本和 usage。记录可观察的输入输出与简短决策摘要，不把私有思维链当作必备日志。不同语言服务通过 trace context 连起来。"}, {"title": "看哪些指标", "text": "任务成功率、人工接管率、工具错误率、越权拦截、预算耗尽、检索无结果；延迟看 p50/p95/p99 与 TTFT；资源看队列、并发、供应商限流；成本看每次尝试与每次成功任务。生成速度快但任务失败多，整体体验仍可能差。"}, {"title": "成本拆分", "text": "单任务模型成本是各轮未缓存输入、缓存输入和输出 token 成本之和，再加检索、重排、工具、存储和运行成本。重试与不断增长的历史会使总 token 超出“单轮×轮数”的直觉。每成功任务成本=全部任务总成本/成功任务数；失败率不能从账单里消失。"}, {"title": "隐私和工程规范", "text": "日志默认脱敏，敏感正文按需求受控采样并设置保留期。OpenTelemetry 提供跨系统观测方式，GenAI 语义约定仍需看所用版本的稳定性。维护模型、prompt、检索索引、工具和评测版本，异常后才能定位是哪次变化引发。"}], "exercise": "为自己的 Agent 生成一次完整 trace，挑出最慢和最贵的步骤，做一项优化并重新跑同一评测集。", "accept": "可以从用户报告定位到具体工具和数据版本；成本统计包含失败与重试；日志没有裸露密钥。", "question": "平均延迟正常但用户抱怨卡顿，怎么查？", "answer": "查看 p95/p99、排队、首 token 延迟、工具长尾、供应商限流与流式代理缓冲，并按任务类别和租户拆分。", "refs": ["otel"], "tags": ["AgentOps", "trace", "成本", "p95"], "priority": "P0"}, {"id": 21, "group": "质量与治理", "title": "可靠性、部署与发布工程", "summary": "模型不确定性之外，分布式系统的老问题一个也不会自动消失。", "sections": [{"title": "故障模型", "text": "依赖可能慢、失败、重复返回、部分成功或状态未知。对网络错误、429、业务拒绝和参数错误采用不同处理；设定 deadline 和重试预算。熔断保护下游，背压保护自己，降级必须保证权限与业务约束。"}, {"title": "发布单元包括什么", "text": "代码、依赖、prompt、模型选择、工具 schema、知识索引、记忆策略和配置都可能改变行为。将它们版本化，固定回归集；离线测试后小流量发布，观察业务指标，再逐步放量。回滚代码不一定能回滚已经发生的外部动作或错误记忆。"}, {"title": "容器和 Kubernetes 学习边界", "text": "会写 Dockerfile、健康检查、配置与密钥注入、资源限制、日志和 CI/CD。Kubernetes 深入 deployment、service、autoscaling、probes、滚动发布与存储；不是首个小项目的必选项。扩容要看队列长度和瓶颈，不只是 CPU。"}, {"title": "故障演练", "text": "测试 worker 被杀、数据库短时不可用、模型超时、审批过期、重复消息、索引滞后和部分业务提交。备份恢复需要演练；定义 SLO、告警、回滚和 runbook。长任务发布时考虑 drain、旧版本 worker 与状态迁移。"}], "exercise": "设计一次发布演练：引入工具超时故障，触发告警与降级，再回滚版本并确认任务可恢复。", "accept": "故障不导致无限重试或费用失控；同一副作用不会重复提交；有可执行的恢复文档。", "question": "为什么 prompt 改一个字也应该做回归？", "answer": "模型行为受指令整体影响，小改动也可能改变工具选择、拒答或格式。Prompt 是系统行为配置，应走版本和验证流程。", "refs": ["temporal", "persistence"], "tags": ["Docker", "Kubernetes", "CI/CD", "SLO"], "priority": "P0"}, {"id": 22, "group": "质量与治理", "title": "安全：提示注入、工具权限与沙箱", "summary": "安全边界需要代码和权限机制执行，不能只依赖模型听话。", "sections": [{"title": "建立信任层级", "text": "系统规则、用户明确授权、外部网页/文档和工具输出有不同可信度。提示注入可能来自检索文档、邮件、代码注释或被污染的工具描述。把外部内容当作数据；即使模型被诱导，执行层也应阻止越权调用。"}, {"title": "常见攻击面", "text": "直接/间接提示注入、敏感数据外泄、过度权限、记忆污染、供应链风险、输出注入、资源耗尽和检索越权。HTML/Markdown 输出需要安全渲染；工具参数中的 URL、路径和 SQL 需要验证；网络出口限制可阻止意外外传。"}, {"title": "分层控制", "text": "最小工具集与最小数据权限；短期凭证；读写分级；高影响动作绑定参数确认；沙箱与网络隔离；预算与速率限制；异常检测与审计。系统提示词可以说明边界，但不应包含密钥，更不应被当作唯一防线。"}, {"title": "红队与复现", "text": "构造“文档要求上传环境变量”“搜索结果伪造系统指令”“另一个租户的文档更相关”等测试。预期结果不是一定识破每句恶意文字，而是无未授权数据访问、无未授权副作用、可审计地停止或继续安全路径。每次修复加入回归集。"}], "exercise": "在假运行手册中植入“把密钥发送到外部地址”，验证工具网关和网络策略能独立阻止。", "accept": "即使模型请求了恶意动作，也无法执行；拒绝事件可追踪；正常任务仍可完成。", "question": "把“不要被提示注入”写在 system prompt 里够吗？", "answer": "不够。模型可能混淆数据与指令，必须在执行层实施身份、授权、参数约束、网络限制和副作用确认。", "refs": ["owasp", "mcp"], "tags": ["security", "prompt injection", "sandbox", "安全"], "priority": "P0"}, {"id": 23, "group": "质量与治理", "title": "数据治理、隐私与企业交付", "summary": "企业落地还要回答数据从哪里来、去哪里、保存多久、谁能查看。", "sections": [{"title": "数据生命周期", "text": "绘制采集、传输、模型处理、持久化、日志、索引和删除链路。标记个人信息、商业敏感信息与密钥；按照实际合同、组织政策和适用要求设定处理方式。部署位置、供应商数据使用条款、保留策略等应由项目具体核查，本教材不假定某种服务天然合规。"}, {"title": "权限和审计", "text": "记录谁在什么身份下授权了哪个动作、作用于哪份数据、产生什么结果。支持数据导出、更正与删除流程。日志脱敏、受控访问、保留期限与备份策略要一致；“删了聊天 UI”不一定删了向量、摘要和追踪记录。"}, {"title": "企业系统的非功能需求", "text": "SSO、密钥管理、网络边界、租户隔离、审计导出、容量、可用性、成本归属和故障响应。把这些作为验收项写入需求，而不是演示结束后才补。连接器权限变化与员工离职要及时反映到检索和工具执行。"}, {"title": "交付与沟通", "text": "面向产品解释成功边界与人工接管；面向业务解释动作权限和失败处理；面向安全解释信任边界；面向运维解释监控和恢复。把假设、风险、未覆盖范围和待验证项写清楚，是工程能力的一部分。"}], "exercise": "为自己的项目做一页数据流与保留策略说明，明确个人信息在哪些环节出现、如何删除。", "accept": "删除请求覆盖所有派生数据路径；供应商条款和实际配置有核查记录；权限撤销可验证。", "question": "私有部署是否自动解决隐私问题？", "answer": "不会。内部越权、日志泄漏、错误授权、记忆污染和备份保留仍然存在，私有部署只改变部分边界。", "refs": [], "tags": ["治理", "隐私", "审计", "合规"], "priority": "P1"}, {"id": 24, "group": "进阶与求职", "title": "微调、偏好优化与 Agent 学习", "summary": "先用评测定位问题，确认训练能解决，再投入训练成本。", "sections": [{"title": "先判断缺什么", "text": "缺最新知识通常先改数据与检索；格式和领域任务模式不稳定可考虑 SFT；偏好选择问题可研究 DPO 等方法；长程决策需要考虑基于环境反馈的学习。微调不代替实时数据、权限检查和可靠执行，训练数据差会固化错误。"}, {"title": "SFT 与 LoRA", "text": "SFT 使用输入—目标输出示例；需要高质量、去重、分布匹配的数据以及独立验证集。LoRA 用低秩增量适配权重，减少可训练参数和训练资源；选择 rank、目标层、学习率与精度应做实验。小规模项目不需要先训练一个基础模型。"}, {"title": "偏好与强化学习", "text": "DPO 使用成对偏好优化相对选择；RL 用奖励反馈优化策略，可能需要 rollout、环境、奖励函数和策略更新。Agent 学习还面临长程信用分配、工具非确定性、奖励作弊和仿真与现实差距。离线高分不等于真实系统可靠。"}, {"title": "训练交付检查", "text": "记录数据来源、许可和清洗版本；防止训练/测试泄漏；比较基线和训练模型在通用、领域、安全与长尾任务上的变化；算训练与服务成本。评估灾难性遗忘、工具行为漂移和回滚。对应用求职先完成一次小实验，对研究岗位再深入优化理论。"}], "exercise": "选择一个可验证的小型分类或工具参数任务，比较 prompt-only 与小规模 LoRA；没有 GPU 时先做完整数据和评测方案。", "accept": "有独立保留集、训练配置、真实结果和失败案例；不会把训练集准确率当作泛化能力。", "question": "RAG、fine-tuning 与 memory 如何选择？", "answer": "RAG 供给可更新证据；微调改变模型行为分布；memory 保存个体或任务经验。按问题来源选择，可组合，但要分别证明收益。", "refs": ["lora", "peft"], "tags": ["SFT", "LoRA", "DPO", "RL", "训练"], "priority": "P2"}, {"id": 25, "group": "进阶与求职", "title": "多模态、浏览器与 Coding Agent", "summary": "当工具能看屏幕、操作网页或执行代码，验证与隔离更重要。", "sections": [{"title": "多模态理解", "text": "图像涉及分辨率、裁剪、OCR 和空间关系；音频涉及 ASR、说话人、时间戳与噪声；实时语音还要处理打断、轮次和延迟；视频涉及采样与时序。评价应覆盖模态质量、延迟和业务任务，不能只看文字回答。"}, {"title": "浏览器 Agent", "text": "状态可来自 DOM、可访问性树或截图；动作应尽量通过稳定定位和可见状态确认。页面跳转、弹窗、登录过期和异步加载会使旧状态失效。执行后重新观察；网络请求成功不一定代表界面完成，高影响提交需要明确授权。"}, {"title": "Coding Agent", "text": "常见循环是读仓库、定位、编辑、运行检查、解释变化。要有隔离工作区、命令权限、依赖控制、测试基线、diff 审查和产物管理。测试全绿并不能证明没有越权改动；还要检查改动范围、安全和业务需求。"}, {"title": "Computer use 的边界", "text": "坐标操作易受分辨率和页面变化影响；不要根据过时截图盲目点击。敏感操作需要清晰的状态与确认。让 Agent 运行代码、读文件或联网时，每一种能力都增加独立的安全面，沙箱资源和权限按任务最小化。"}], "exercise": "构建只在测试网站上运行的浏览器任务，或在沙箱仓库中修复一个已知 bug，保留操作与验证记录。", "accept": "失败可以重现；状态变化后重新观察；不会操作测试范围之外的数据。", "question": "Coding Agent 如何防止通过删除测试来“修好”问题？", "answer": "保护基线测试与验收器，检查 diff 范围，使用独立外部测试并审查测试变更；不能让被评测对象同时决定全部评分规则。", "refs": [], "tags": ["multimodal", "browser", "coding agent", "语音"], "priority": "P1"}, {"id": 26, "group": "进阶与求职", "title": "产品体验与人机协作", "summary": "可靠的 Agent 产品让用户理解正在发生什么，并能在关键位置接管。", "sections": [{"title": "自治等级", "text": "可以从建议、生成草案、确认执行逐渐到限定范围自动执行。每级都需要定义允许范围、撤销/补偿方式和审计。高影响操作适合先展示具体差异、目标对象和费用，用户批准的是这些参数，而不是一句模糊的“继续”。"}, {"title": "可用性细节", "text": "说明缺少哪些信息；区分无结果、无权限与工具故障；呈现证据来源、有效时间和可验证产物。允许编辑草案、取消、纠正记忆和切换人工。状态信息应基于真实事件，不以编造的思考内容填充等待时间。"}, {"title": "业务指标", "text": "关注一次任务完成率、用户修正量、接管率、解决时间和重复使用，而不是只统计聊天轮数。更长的会话可能说明问题没解决。成本和收益应纳入失败与人工审核时间，不只算模型 token。"}, {"title": "上线后的反馈闭环", "text": "将用户反馈、人工修正与失败 trace 转成经过审核的评测案例。明确反馈是否适合成为记忆或训练数据，防止错误和恶意反馈自动改变系统。以小流量验证新策略，再持续迭代。"}], "exercise": "画出任务提交、处理中、待确认、成功、部分失败、人工接管六种页面状态。", "accept": "用户能理解哪些动作已完成、哪些只是建议；确认页面绑定具体对象和参数。", "question": "如何减少用户反复确认又保证可控？", "answer": "对低风险、已授权范围建立可理解的操作政策；高影响或越界动作再确认。不要按每个工具调用机械弹窗，也不要无限扩大一次授权。", "refs": [], "tags": ["UX", "HITL", "product", "人工接管"], "priority": "P1"}, {"id": 27, "group": "进阶与求职", "title": "求职准备、系统设计与持续进阶", "summary": "用可复现的工程证据证明能力，并围绕目标岗位补深度。", "sections": [{"title": "如何读职位描述", "text": "先标注交付物：业务应用、Agent 平台、推理服务还是训练算法；再找必需技术与级别。将每个要求映射到项目证据：状态恢复演练、检索评测、trace、容量测试、安全案例。职位名很宽泛，本文岗位地图是学习建议，不是对所有市场岗位的统计结论。"}, {"title": "简历与作品集", "text": "写清业务问题、你负责的部分、架构取舍、数据规模、评测口径、性能与失败边界。用真实测量填数字，没有测就保留待测。项目仓库包含 README、架构图、一键启动、脱敏样本、评测脚本、结果报告、故障复盘和演示视频。不要把“使用某某框架”当作主要成果。"}, {"title": "面试结构", "text": "编码：Python 异步、Java 并发与常见数据结构；基础：LLM、RAG、memory、工具调用；设计：容量、状态、权限、成本、故障；项目追问：为什么选这个方案，失败过什么，如何证明改善。系统设计先澄清场景与 SLO，再画数据流，最后深入关键风险和取舍。"}, {"title": "进阶方向", "text": "平台方向：任务调度、沙箱、状态持久化、租户治理；推理方向：GPU 体系、并行、KV 与性能；算法方向：训练、Agent RL、规划和记忆研究；应用方向：行业流程、连接器、评测和产品。每周选一个真实失败做复现或读一篇论文并设计验证，避免只追框架发布。"}], "exercise": "用 10 分钟讲清毕业项目，再让同伴追问崩溃恢复、错误记忆、权限绕过和成本估算。", "accept": "每项简历成果有可查证材料；能在不用框架术语的情况下解释系统，并坦诚说明未覆盖范围。", "question": "没有大模型训练经验能做 Agent 工程师吗？", "answer": "可以先定位应用或平台岗位，并证明模型集成、状态、工具、评测和交付能力。训练算法岗位要求不同，应按目标职位补训练和研究经验。", "refs": ["jobs"], "tags": ["面试", "简历", "系统设计", "职业"], "priority": "P0"}], "sources": {"jobs": {"title": "Anthropic：Applied AI Engineer, Enterprise 岗位样本", "url": "https://job-boards.greenhouse.io/anthropic/jobs/5057647008", "note": "岗位样本提到生产应用、评测、Agent、MCP、部署与沟通；仅一个样本，不代表中国或整个行业。"}, "effective": {"title": "Anthropic：Building effective agents", "url": "https://www.anthropic.com/research/building-effective-agents", "note": "用来理解 workflow 与 agent 的设计模式；原文发表于 2024 年，工具细节应查当前文档。"}, "transformer": {"title": "Attention Is All You Need", "url": "https://arxiv.org/abs/1706.03762", "note": "Transformer 与经典注意力机制原论文；不是现代所有模型架构的完整描述。"}, "context": {"title": "Anthropic：Effective context engineering", "url": "https://www.anthropic.com/research/effective-context-engineering-for-ai-agents", "note": "上下文选择、压缩和按需检索的工程讨论。"}, "springtools": {"title": "Spring AI：Tool Calling", "url": "https://docs.spring.io/spring-ai/reference/api/tools.html", "note": "Java 工具调用接口与执行职责；实现时固定所用版本。"}, "spring": {"title": "Spring AI Reference", "url": "https://docs.spring.io/spring-ai/reference/index.html", "note": "Java 模型、工具、RAG 和 memory 能力入口。"}, "persistence": {"title": "LangGraph：Persistence", "url": "https://docs.langchain.com/oss/python/langgraph/persistence", "note": "持久化、checkpoint 与执行恢复概念。"}, "memory": {"title": "LangChain：Memory overview", "url": "https://docs.langchain.com/oss/python/concepts/memory", "note": "会话作用域与跨会话记忆的概念参考。"}, "rag": {"title": "Retrieval-Augmented Generation 原论文", "url": "https://arxiv.org/abs/2005.11401", "note": "参数化与外部检索记忆结合的研究起点；工程流程是本教材综合设计。"}, "pgvector": {"title": "pgvector 官方仓库", "url": "https://github.com/pgvector/pgvector", "note": "PostgreSQL 向量检索、索引和过滤实现参考。"}, "mcp": {"title": "MCP：Architecture overview", "url": "https://modelcontextprotocol.io/docs/learn/architecture", "note": "协议架构和能力边界；对接应以固定规范版本为准。"}, "a2a": {"title": "A2A：What is A2A?", "url": "https://a2a-protocol.org/latest/topics/what-is-a2a/", "note": "跨 Agent 互操作与任务交流。"}, "temporal": {"title": "Temporal：Activity Definition", "url": "https://docs.temporal.io/activity-definition", "note": "外部动作与幂等设计的参考。"}, "vllm": {"title": "vLLM：Automatic Prefix Caching", "url": "https://docs.vllm.ai/en/latest/features/automatic_prefix_caching/", "note": "前缀 KV 复用机制；性能收益依赖实际工作负载。"}, "evals": {"title": "Anthropic：Demystifying evals for AI agents", "url": "https://www.anthropic.com/research/demystifying-evals-for-ai-agents", "note": "任务、trial、grader、trace 与最终环境状态的评测思路。"}, "otel": {"title": "OpenTelemetry：GenAI semantic conventions", "url": "https://opentelemetry.io/docs/specs/semconv/gen-ai/", "note": "观测语义约定入口；关注所用版本与稳定性。"}, "owasp": {"title": "OWASP：LLM Top 10（2025）", "url": "https://genai.owasp.org/llm-top-10/", "note": "提示注入、敏感数据、过度权限等风险分类。"}, "lora": {"title": "LoRA 原论文", "url": "https://arxiv.org/abs/2106.09685", "note": "低秩适配方法。"}, "peft": {"title": "Hugging Face PEFT：LoRA", "url": "https://huggingface.co/docs/peft/en/conceptual_guides/lora", "note": "参数高效微调的实现概念与限制。"}}, "roadmap": [{"weeks": "1–2", "title": "模型与最小 Agent", "hours": 24, "chapters": [1, 2, 3, 4, 5, 6], "tasks": ["选熟悉业务并建立 20 个任务样本", "比较两种模型；实现 schema 校验和 3 个只读工具", "做 6 步有界循环，记录每一步输入输出"], "output": "可运行的工具型助手 + 基线评测", "gate": "能解释调用链，非法参数与预算超限不会继续执行。"}, {"weeks": "3–4", "title": "知识检索与证据", "hours": 24, "chapters": [10, 11, 19], "tasks": ["摄入 30 份文档，保存来源和 ACL", "比较关键词、向量、混合与重排", "建立 50 个带标签问题，记录分层指标"], "output": "带引用的 RAG 服务 + 检索评测", "gate": "能定位未召回、误重排与生成不忠实三类失败。"}, {"weeks": "5–6", "title": "记忆与上下文", "hours": 24, "chapters": [4, 8, 9], "tasks": ["实现偏好记忆的写入、更新、TTL 与删除", "做两个用户的隔离测试", "比较无记忆、原始历史、摘要加检索"], "output": "受控 memory 服务 + 消融报告", "gate": "没有跨用户泄漏；冲突与删除传播有测试。"}, {"weeks": "7–8", "title": "接入 Java 业务", "hours": 24, "chapters": [7, 13, 14, 15, 16], "tasks": ["Spring Boot 提供查询与工单草案工具", "增加任务状态、SSE 和人工确认", "实现稳定 action_id 与业务去重"], "output": "Python/Java 可恢复业务 Agent", "gate": "写后崩溃再恢复不重复提交；审批绑定具体参数。"}, {"weeks": "9–10", "title": "质量、安全与观测", "hours": 24, "chapters": [19, 20, 22, 23], "tasks": ["增加失败、注入和越权案例", "贯通 trace、版本与 token 成本", "做 A/B 重复评测和失败切片"], "output": "评测报告 + 安全回归 + Trace 示例", "gate": "能证明改善；安全失败不能被平均成功率掩盖。"}, {"weeks": "11–12", "title": "部署、容量与恢复", "hours": 24, "chapters": [17, 18, 21], "tasks": ["容器部署与资源限额", "压测排队、p95 和供应商限流", "演练 worker 中断、依赖超时和回滚"], "output": "部署说明 + 压测与故障复盘", "gate": "明确瓶颈、SLO 和恢复策略；不报脱离环境的性能数字。"}, {"weeks": "13–14", "title": "按目标岗位深入", "hours": 24, "chapters": [12, 24, 25, 26], "tasks": ["应用：完整行业闭环与人工接管", "平台：调度、沙箱、持久化和多租户", "推理/算法：选一个性能或训练实验"], "output": "一项有对照数据的深入实验", "gate": "与简单基线比较，解释新增复杂度是否值得。"}, {"weeks": "15–16", "title": "作品集与面试", "hours": 24, "chapters": [27], "tasks": ["整理仓库、演示、架构图和评测证据", "练习 45 分钟系统设计与 10 分钟项目讲解", "根据目标 JD 调整简历并复盘模拟面试"], "output": "可审查作品集 + 求职材料", "gate": "独立回答故障、权限、成本和取舍，所有数字都有依据。"}], "projects": [{"title": "项目一：企业知识助手", "level": "入门闭环", "hours": "约 30–45 小时", "problem": "用内部运行手册回答问题，必须提供可追溯证据。", "features": ["文档解析、增量更新、ACL、混合检索、重排", "带来源的回答、无答案处理、版本过滤", "检索指标与答案支持度评测"], "deliver": ["一键启动与 30 份脱敏文档", "50 个标注问题和四组检索对照", "5 个真实失败案例与修复说明"], "threshold": "教学验收建议：授权语料 Recall@5 ≥ 0.85；引用 ID 有效率 100%；跨租户泄漏 0。阈值只用于练习，实际需按数据和风险重设。"}, {"title": "项目二：记忆型任务助手", "level": "状态与记忆", "hours": "约 35–50 小时", "problem": "跨会话记住明确偏好，跟踪长任务，并能纠正与遗忘。", "features": ["结构化偏好、来源、版本、TTL 和删除", "任务 checkpoint、上下文预算与断点恢复", "无记忆 / 全量历史 / 受控记忆消融"], "deliver": ["记忆生命周期图和数据模型", "冲突、过期、删除、隔离用例", "恢复演练和成功率/成本对比"], "threshold": "教学验收建议：测试集中隔离与删除用例全部通过；明确更正不被旧事实覆盖；无无限循环。"}, {"title": "毕业项目：可审计运维 Copilot", "level": "推荐主项目", "hours": "约 80–120 小时", "problem": "从告警出发，查监控与手册、分析变更、提出处理方案并生成工单；写操作经过授权。", "features": ["Java 业务 API + Python Agent 或 Java 单栈", "有界循环、RAG、可选偏好记忆、工具网关", "异步任务、SSE、审批、幂等与故障恢复", "trace、成本、评测门禁、容器部署与安全回归"], "deliver": ["完整 README、架构决策、接口与数据模型", "50–100 个任务及三轮评测，按类别报告", "写后崩溃演练、负载测试、注入回归", "5 分钟演示 + 10 分钟设计讲解"], "threshold": "教学验收建议：关键副作用重复提交为 0；未授权写入为 0；任务成功率目标自定并说明样本；p95 与成本达到事先声明的预算。"}, {"title": "方向项目：推理或训练实验", "level": "选修", "hours": "约 25–50 小时", "problem": "为一个明确瓶颈提供数据支撑的优化，而非堆砌基础设施。", "features": ["推理：输入/输出长度、批处理、缓存与显存", "算法：prompt 与 LoRA 对照、领域泛化与安全", "平台：公平调度、沙箱资源限制或任务恢复"], "deliver": ["固定环境和复现实验脚本", "同质量约束下性能对照或独立保留集结果", "适用范围、成本和失败边界"], "threshold": "必须与简单基线比较；不得以牺牲权限或隐瞒失败样本换取好看的结果。"}], "glossary": [["Agent", "根据目标与观察决定下一步、调用工具并更新状态的系统。"], ["Harness", "包围模型的运行支架：上下文、工具、状态、预算、权限和验证。"], ["Workflow", "由预先定义的步骤和分支推进的流程，可包含模型调用。"], ["Token", "模型处理的序列单位，不等于一个字或一个单词。"], ["Embedding", "将输入映射为向量表示，用于相似性或后续模型计算。"], ["Transformer", "以注意力等模块处理序列的神经网络架构家族。"], ["Attention", "根据表示间关系聚合信息的机制。"], ["Temperature", "调整采样分布的参数，不是事实可信度。"], ["Context window", "一次推理可处理的上下文与生成预算限制，具体规则依接口而定。"], ["Context engineering", "为每轮决策选择、组织和更新上下文的工程过程。"], ["Tool calling", "模型发出结构化动作请求，应用执行并返回结果的交互。"], ["JSON Schema", "描述 JSON 结构与字段约束的规范。"], ["ReAct", "将决策与工具行动、环境观察交替组织的模式。"], ["Planning", "将目标拆成可执行步骤，并依据新证据调整。"], ["Handoff", "将任务或控制权转交给其他执行单元。"], ["Checkpoint", "运行过程中持久保存的状态快照或进度。"], ["Idempotency", "同一业务操作重复提交时不重复产生预期之外的副作用。"], ["Outbox", "将业务状态和待发送事件在本地事务中一起记录的模式。"], ["Memory", "保存并在后续任务中使用交互信息的机制。"], ["Semantic memory", "事实和偏好类长期记忆。"], ["Episodic memory", "过去事件、过程和结果类记忆。"], ["Procedural memory", "流程、方法或行为规则类记忆。"], ["TTL", "数据或缓存的有效时间。"], ["RAG", "在生成前或过程中检索外部信息并提供给模型。"], ["Chunk", "为存储或检索而划分的文档片段。"], ["BM25", "基于词项匹配与统计权重的关键词排序方法。"], ["Hybrid search", "组合关键词与语义等多种检索信号。"], ["RRF", "用候选的排名而非不可比原始分数进行融合。"], ["Reranker", "对已召回候选进行更精细相关性排序的模型或算法。"], ["HNSW", "基于图的近似最近邻索引方法。"], ["Recall@k", "前 k 个结果覆盖全部相关项的比例。"], ["Precision@k", "前 k 个结果中相关项的比例。"], ["MRR", "第一个相关结果排名倒数的平均值。"], ["nDCG", "考虑相关性等级与位置折损的排序指标。"], ["MCP", "连接 Agent 应用与工具、资源等能力的协议。"], ["A2A", "Agent 间能力发现与任务交互的互操作协议。"], ["SSE", "服务器通过 HTTP 向客户端持续推送事件的机制。"], ["Backpressure", "当下游处理不足时限制上游输入，避免无界积压。"], ["Prefill", "处理输入上下文并准备生成状态的阶段。"], ["Decode", "逐步生成输出 token 的阶段。"], ["KV cache", "缓存注意力键值表示以减少重复计算的机制。"], ["TTFT", "从请求到第一个输出 token 的时间，测量边界需说明。"], ["TPOT", "输出 token 之间平均耗时的一种测量方式。"], ["Continuous batching", "动态合并进行中的推理请求以提升资源利用率。"], ["Quantization", "用更低精度表示权重或中间数据的技术。"], ["SFT", "使用示例输入输出进行监督微调。"], ["LoRA", "通过低秩参数增量适配模型的方法。"], ["DPO", "使用成对偏好优化模型相对选择的方法。"], ["RL", "通过环境反馈和奖励学习策略的方法族。"], ["Eval", "对任务表现进行可重复测量的过程。"], ["Grader", "按照规则、模型或人工标准判定任务表现的评分器。"], ["Trace", "一次执行跨步骤与服务的记录。"], ["SLO", "面向服务表现的可测量目标。"], ["p95", "95% 样本不超过该值的分位数。"], ["Prompt injection", "通过不可信内容诱导系统偏离授权指令的攻击。"], ["RBAC / ABAC", "基于角色 / 属性进行访问控制的方式。"], ["Sandbox", "限制执行环境能访问的资源和能力的隔离机制。"], ["HITL", "在流程中引入人的判断、确认或接管。"], ["Ablation", "移除某组件进行对照，以判断其实际贡献。"], ["Data leakage", "训练或调参中接触测试答案，导致评估偏乐观。"]], "extra_questions": [["系统设计", "设计一个企业知识 Agent，你会先问什么？", "问用户与租户规模、文档类型与更新频率、权限模型、允许动作、SLO、预算和成功标准。再画摄入、检索、运行时、工具、存储与观测的数据流。"], ["故障恢复", "工具超时后可否立即重试？", "先判断操作是否可能已生效。只读或幂等操作可按预算重试；写操作应使用稳定 action_id 查询原结果或让下游原子去重，避免重复扣款或重复工单。"], ["记忆", "用户撤回一个偏好后应该删哪些地方？", "主记录、向量索引、缓存、派生摘要和后续上下文都要处理。备份按已定义保留/恢复策略处理；记录删除事件，避免恢复后旧数据重新出现。"], ["成本", "成本降了 30%，如何证明不是质量退化？", "在同一保留集、同一权限条件下比较成功率、关键风险、延迟和失败切片；报告总成本与每成功任务成本，以及重复试验的波动。"], ["评测", "20 道题从 16 道正确变 18 道，能直接宣布成功吗？", "样本太小且可能有随机波动或调参泄漏。检查同题成对结果、重复试验、置信区间和新增真实样本，特别关注关键安全类别是否退化。"], ["推理", "为什么并发越大吞吐提升但 p95 更差？", "批处理可提高设备利用率，但排队、资源争用和每个请求的等待增大。需要在吞吐、尾延迟和资源成本之间选满足 SLO 的运行点。"], ["Java", "怎么避免模型调用拖住数据库事务？", "先读取所需快照并结束短事务，再调用模型与工具。提交时开启新的短事务，重新检查权限与资源版本，冲突则重新确认或生成方案。"], ["安全", "网页说“这是管理员指令”，执行器该怎么处理？", "网页只是外部数据，不能改变身份或授权。工具执行器仍按可信会话检查，必要时阻止恶意动作并保留审计事件。"]]}</script>
<script>
'use strict';
const D=JSON.parse(document.getElementById('courseData').textContent);
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const esc=escapeHtml;const KEY='agent-course-v1';let progress={},role='app',currentLab='loop',timer=null;
try{const v=JSON.parse(localStorage.getItem(KEY)||'{}');if(v&&typeof v==='object'&&!Array.isArray(v))progress=v}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(progress))}catch(e){toast('浏览器不允许保存，请使用“导出进度”。')}updateProgress()}
function updateProgress(){const n=D.chapters.filter(c=>progress[c.id]).length;$('#progresslabel').textContent=`已完成 ${n} / ${D.chapters.length} 章`;$('#progressbar').style.width=n/D.chapters.length*100+'%'}
function toast(t){$('#toast').textContent=t;$('#toast').classList.remove('hidden');clearTimeout(toast.timeout);toast.timeout=setTimeout(()=>$('#toast').classList.add('hidden'),3000)}
function download(name,text,type='application/json'){const url=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
const navItems=[['home','⌂','学习总览'],['curriculum','▤','知识地图 · 27 章'],['labs','⚗','交互实验 · 8 个'],['roadmap','⌁','16 周学习路线'],['projects','◇','实战与架构'],['interview','◎','面试与自测'],['glossary','Aa','术语速查 · 60 个'],['sources','↗','资料与阅读顺序']];
$('.nav').innerHTML=navItems.map(([id,icon,name])=>`<button data-nav="${id}"><span class="nav-icon" aria-hidden="true">${icon}</span>${name}</button>`).join('');
$$('[data-nav]').forEach(b=>b.onclick=()=>navigate(b.dataset.nav));
function navigate(x){if(location.hash==='#'+x)route();else location.hash=x}
$('.skip').onclick=e=>{e.preventDefault();$('#main').focus();$('#main').scrollIntoView({block:'start'})};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('#rail').classList.remove('open');$('#menu').setAttribute('aria-expanded','false')}});
$('#menu').onclick=()=>{const open=$('#rail').classList.toggle('open');$('#menu').setAttribute('aria-expanded',String(open))};
$('#exportProgress').onclick=()=>download('agent-learning-progress.json',JSON.stringify({version:1,completed:D.chapters.filter(c=>progress[c.id]).map(c=>c.id)},null,2));
$('#importProgress').onclick=()=>$('#progressFile').click();$('#progressFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>100000)throw Error();const v=JSON.parse(await f.text());if(v.version!==1||!Array.isArray(v.completed)||v.completed.some(n=>!Number.isInteger(n)||n<1||n>D.chapters.length))throw Error();progress=Object.fromEntries(v.completed.map(n=>[n,true]));save();route();toast('学习进度已导入')}catch(err){toast('文件格式不正确，请导入本教材导出的 JSON。')}e.target.value=''};
$('#resetProgress').onclick=()=>{if(confirm('清空当前浏览器的学习进度？教材和实验不受影响。')){progress={};save();route()}};
$('#printAll').onclick=()=>{renderPrint();window.print()};
let searchTimer;$('#search').oninput=e=>{clearTimeout(searchTimer);const q=e.target.value.trim();if(q){searchTimer=setTimeout(()=>renderSearch(q),160)}else route()};
function footer(){return `<div class="footer">本教材是面向工程岗位的系统化学习路线。正文为综合教学设计，官方来源供核对与深读。实验均在浏览器本地运行，不调用真实模型，不执行外部业务动作。</div>`}
function intro(title,description,label=''){return `<div class="page-intro">${label?`<p class="eyebrow">${label}</p>`:''}<h1>${title}</h1><p class="lead">${description}</p></div>`}
function chapterLink(id,label){return `<a href="#chapter-${id}">${label||D.chapters[id-1].title}</a>`}
function pill(p){return `<span class="pill ${p==='P1'?'p1':p==='P2'?'p2':''}">${p}</span>`}
function bindChecks(){$$('[data-check]').forEach(e=>e.onchange=()=>{progress[e.dataset.check]=e.checked;save();$$('[data-check="'+e.dataset.check+'"]').forEach(x=>x.checked=e.checked)})}
function route(){clearTimeout(timer);const hash=location.hash.slice(1)||'home';$('#search').value='';$('#rail').classList.remove('open');$('#menu').setAttribute('aria-expanded','false');const tab=hash.startsWith('chapter-')?'curriculum':hash.startsWith('lab-')?'labs':hash;$$('[data-nav]').forEach(b=>{b.classList.toggle('active',b.dataset.nav===tab);b.setAttribute('aria-current',b.dataset.nav===tab?'page':'false')});$('#breadcrumb').textContent=(navItems.find(n=>n[0]===tab)||navItems[0])[2];const routes={home:renderHome,curriculum:renderCurriculum,labs:renderLabs,roadmap:renderRoadmap,projects:renderProjects,interview:renderInterview,glossary:renderGlossary,sources:renderSources};if(hash.startsWith('chapter-'))renderChapter(Number(hash.slice(8)));else if(hash.startsWith('lab-')){currentLab=hash.slice(4);renderLabs()}else (routes[hash]||renderHome)();window.scrollTo({top:0,behavior:'instant'});$('#main').focus({preventScroll:true});updateProgress()}

function control(id,label,kind,value,min,max,step=1){return `<div class="control"><label for="${id}">${label}${kind==='range'?`<output id="${id}Value">${value}</output>`:''}</label><input id="${id}" type="${kind}" value="${value}" min="${min}" max="${max}" step="${step}"></div>`}
function select(id,label,options){return `<div class="control"><label for="${id}">${label}</label><select id="${id}">${options.map(([v,t])=>`<option value="${v}">${t}</option>`).join('')}</select></div>`}

function labLoop(){let index=0,approved=false,stopped=false,logs=[];
labLayout(select('loopScenario','场景',[['normal','正常诊断与工单草案'],['timeout','检索工具一次超时'],['injection','文档中夹带恶意指令']])+control('stepBudget','最多执行步数','range',10,3,12)+`<p class="small muted full">固定任务：分析支付服务告警，找到证据，生成工单。这里用脚本模拟决策，展示状态、权限和退出条件。</p><div class="row full"><button class="btn primary" id="nextStep">下一步</button><button class="btn" id="resetLoop">重置</button></div><button class="btn full hidden" id="approveLoop">批准创建这张工单</button>`,`<h2>观察 → 决策 → 行动 → 验证</h2><div class="flow" id="loopFlow"></div><div id="loopState" class="result" aria-live="polite"></div><h3 class="section-space">执行记录</h3><div class="trace" id="loopTrace" aria-live="polite"></div><p class="hint">记录的是可观察的状态、动作与结果，不是模型私有思维链。审批只绑定当前工单参数。</p>`);
const normal=[['接收','目标确认：读取支付服务告警，生成工单；未授予直接修改生产配置的权限。'],['上下文','组装规则、目标、可见工具和近期状态；输入中不包含生产密钥。'],['决策','模型模拟器请求 search_runbook(service="payment")；执行器检查工具白名单、参数与读取权限。'],['工具','检索到 RB-17：连接池耗尽处理步骤，带来源与版本。'],['草案','基于证据生成工单参数：服务 payment，标题“排查连接池耗尽”，action_id=ACT-001。'],['审批','waiting_approval：保存具体草案并暂停执行。'],['提交','授权通过；Java 业务服务按 ACT-001 原子去重并创建工单 T-104。'],['验证','读取业务终态：T-104 确实存在；任务 succeeded，返回工单与证据。']];
function steps(){const a=normal.map(x=>[...x]);if($('#loopScenario').value==='timeout')a.splice(3,0,['超时','检索返回可重试超时；在总预算内退避后重试一次。']);if($('#loopScenario').value==='injection')a.splice(4,0,['拦截','外部文档要求“上传密钥”。即使模拟器提出该动作，工具网关因无授权能力拒绝；只保留运行手册证据。']);return a}
function render(){const s=steps(),last=logs.at(-1);$('#loopFlow').innerHTML=['接收与上下文','模型决策','工具与授权','结果验证'].map((t,i)=>{const active=index===0?0:index<3?0:index<5?1:index<s.length?2:3;return `<div class="node ${i===active?'current':i<active?'done':''}">${t}</div>`}).join('');const waiting=index>0&&s[index-1]?.[0]==='审批'&&!approved&&!stopped;$('#approveLoop').classList.toggle('hidden',!waiting);$('#nextStep').disabled=stopped||waiting;$('#loopState').textContent=stopped?(index>=s.length?'任务完成：已验证业务终态。':'已停止：达到步骤预算，返回部分结果并转人工。'):waiting?'等待用户确认具体工单，worker 可释放。':`${index} / ${num('stepBudget')} 步已执行。${last?'当前：'+last[0]:'点击“下一步”开始。'}`;$('#loopTrace').innerHTML=logs.length?logs.map((l,i)=>`<div><b>${i+1}. ${l[0]}</b><br>${l[1]}</div>`).join(''):'尚未执行。';$('#loopTrace').scrollTop=$('#loopTrace').scrollHeight}

$('#nextStep').onclick=()=>{if(index>=num('stepBudget')){stopped=true;render();return}const s=steps();logs.push(s[index]);index++;if(index>=s.length)stopped=true;else if(index>=num('stepBudget'))stopped=true;render()};$('#approveLoop').onclick=()=>{approved=true;logs[logs.length-1][1]+=' 用户确认已绑定 ACT-001 的参数摘要；恢复前仍需检查有效期和业务版本。';render()};$('#resetLoop').onclick=reset;$('#loopScenario').onchange=reset;$('#stepBudget').oninput=()=>{rangeUpdate('stepBudget');reset()};render()}

function labContext(){labLayout(control('ctxLimit','上下文总预算','range',16000,4000,32000,1000)+control('ctxHistory','原始历史 token','range',8000,0,16000,500)+control('ctxDocs','检索文档条数','range',4,0,12)+control('ctxOutput','预留输出 token','range',2000,500,6000,500)+check('ctxSummary','将历史压缩为原来的 25%')+`<p class="hint full">教学假设：规则 900、工具 800、当前目标 300、必要记忆 300 token；每条文档 500 token。实际应使用对应 tokenizer 与接口预算规则。</p>`,`<h2>把有限上下文分给最有用的信息</h2><div id="contextStats" class="metric-row"></div><div class="bar" id="contextBar" aria-label="上下文各部分占比"></div><div class="legend" id="contextLegend"></div><div id="contextResult" class="result" aria-live="polite"></div><div class="callout"><strong>观察任务</strong><p>把窗口改成 8,000，再取消历史压缩。注意：超预算时本实验会明确报告超额，不会假装模型自动装下全部内容。</p></div><p>压缩只减少本实验的 token 占用，不模拟真实质量提升。实际系统需要测试摘要是否漏掉约束、否定、时间和证据来源。</p>`);
function update(){const hist=num('ctxHistory')*($('#ctxSummary').checked?.25:1),segments=[['规则',900,'#2867a4'],['工具',800,'#5e88b5'],['目标与记忆',600,'#675596'],['对话历史',hist,'#237b72'],['检索证据',num('ctxDocs')*500,'#75a99f'],['输出预留',num('ctxOutput'),'#c18a5f']],used=segments.reduce((s,x)=>s+x[1],0),cap=num('ctxLimit'),input=used-num('ctxOutput');$('#contextStats').innerHTML=metric(input.toLocaleString(),'输入 token')+metric(used.toLocaleString(),'含输出预留')+metric((used/cap*100).toFixed(1)+'%','预算占用');$('#contextBar').innerHTML=segments.map(s=>`<span style="width:${s[1]/Math.max(cap,used)*100}%;background:${s[2]}" title="${s[0]} ${s[1]}"></span>`).join('');$('#contextLegend').innerHTML=segments.map(s=>`<span><i style="background:${s[2]}"></i>${s[0]} ${s[1]}</span>`).join('');$('#contextResult').classList.toggle('error',used>cap);$('#contextResult').textContent=used>cap?`超出 ${used-cap} token。应减少冗余历史、减少/压缩证据，或选择支持该预算的模型；保留规则与工具消息的完整性。`:`剩余 ${cap-used} token。装得下只说明容量满足，不能证明资料相关或答案正确。`}
bindInputs(['ctxLimit','ctxHistory','ctxDocs','ctxOutput','ctxSummary'],update)}

function labMemory(){let records=[],version=0,day=0;labLayout(select('memoryUser','当前可信用户',[['alice','用户 Alice'],['bob','用户 Bob']])+`<div class="full"><button class="btn" id="memoryWrite">写入：偏好中文</button></div><div class="full"><button class="btn" id="memoryCorrect">明确更正：偏好英文</button></div><div class="full"><button class="btn" id="memoryAge">模拟经过 31 天</button></div><div class="full"><button class="btn danger" id="memoryDelete">删除当前用户记忆</button></div><div class="full"><button class="btn small" id="memoryReset">重置实验</button></div><p class="hint full">示例策略：仅接收用户明确陈述；偏好 TTL=30 天；新更正替代旧版本。此处为浏览器内存模拟，刷新或切换实验会重置。</p>`,`<h2>一次写入，多个生命周期状态</h2><div id="memoryStatus" class="result" aria-live="polite"></div><h3 class="section-space">当前用户记录</h3><div id="memoryRecords"></div><div class="callout"><strong>试着切换用户</strong><p>Alice 的记忆不会注入 Bob 的上下文。这里以固定规则演示作用域过滤；真实系统必须在服务端身份与数据库层执行。</p></div><div class="schema">字段：user_id / key / value / source / version / valid_from / expires_at / status</div>`);
function render(){const user=$('#memoryUser').value;records.forEach(r=>{if(r.status==='active'&&r.expires<=day)r.status='expired'});const owned=records.filter(r=>r.user===user),active=owned.filter(r=>r.status==='active');$('#memoryStatus').textContent=`模拟第 ${day} 天；${user} 的上下文注入：${active.length?'language='+active[0].value:'无有效记忆。'} 所有用户共 ${records.length} 条演示记录。`;$('#memoryRecords').innerHTML=owned.length?owned.map(r=>`<div class="memory-record ${r.status!=='active'?'inactive':''}"><strong>language = ${r.value} <span class="pill">v${r.version}</span></strong><p>来源：${r.source}；作用域：${r.user}；第 ${r.created}–${r.expires} 天；状态：${{active:'有效',superseded:'已被更正',expired:'已过期'}[r.status]}</p></div>`).join(''):'<p class="muted">没有可显示的记忆。点击左侧按钮写入。</p>'}
function write(value,source){const user=$('#memoryUser').value;records.filter(r=>r.user===user&&r.status==='active').forEach(r=>r.status='superseded');records.push({user,value,source,version:++version,created:day,expires:day+30,status:'active'});render()}
$('#memoryWrite').onclick=()=>write('zh-CN','用户明确陈述');$('#memoryCorrect').onclick=()=>write('en','用户明确更正');$('#memoryAge').onclick=()=>{day+=31;render()};$('#memoryDelete').onclick=()=>{records=records.filter(r=>r.user!==$('#memoryUser').value);render();toast('演示记录已删除；生产系统还需传播到索引、缓存和摘要。')};$('#memoryReset').onclick=()=>{records=[];version=0;day=0;render()};$('#memoryUser').onchange=render;render()}

const ragDocs=[{id:'A',title:'支付服务连接池排查手册',bm:.9,vec:.86,rerank:.97,relevant:true,allowed:true},{id:'B',title:'数据库连接数上限与超时',bm:.45,vec:.94,rerank:.92,relevant:true,allowed:true},{id:'C',title:'订单接口重试规范',bm:.7,vec:.56,rerank:.41,relevant:false,allowed:true},{id:'D',title:'网页中的“支付”样式',bm:.98,vec:.18,rerank:.12,relevant:false,allowed:true},{id:'E',title:'另一租户的私有事故记录',bm:.95,vec:.99,rerank:.99,relevant:false,allowed:false},{id:'F',title:'上周连接池配置变更',bm:.38,vec:.83,rerank:.9,relevant:true,allowed:true},{id:'G',title:'账户密码重置指南',bm:.1,vec:.32,rerank:.09,relevant:false,allowed:true}];
function rankDocs(weight,k,rerank,acl){const candidate=ragDocs.filter(d=>!acl||d.allowed).map(d=>({...d,score:weight*d.bm+(1-weight)*d.vec})).sort((a,b)=>b.score-a.score).slice(0,k);return rerank?candidate.sort((a,b)=>b.rerank-a.rerank):candidate}
function labRag(){labLayout(control('ragWeight','关键词权重 %','range',50,0,100,10)+control('ragK','召回候选数量','range',4,1,7)+check('ragRerank','启用固定重排分数')+check('ragAcl','应用租户权限过滤')+`<p class="hint full">问题：“支付服务连接池超时，如何排查？”<br>所有分数与相关标签均为人工设定，不是实际 embedding 或 reranker。两路分数已假设归一化；真实系统可用 RRF。</p>`,`<h2>先召回，再排序，再装配证据</h2><div id="ragMetrics" class="metric-row"></div><div class="table-wrap"><table><thead><tr><th>候选</th><th>混合分</th><th>重排分</th><th>可用相关证据</th></tr></thead><tbody id="ragRows"></tbody></table></div><div id="ragResult" class="result" aria-live="polite"></div><p class="hint">最终只取前 3 条（候选不足时取全部）。Recall 分母固定为 3 份授权相关文档 A、B、F；越权文档不算正确证据。</p>`);
function update(){const docs=rankDocs(num('ragWeight')/100,num('ragK'),$('#ragRerank').checked,$('#ragAcl').checked),top=docs.slice(0,3),hits=top.filter(d=>d.relevant).length;$('#ragMetrics').innerHTML=metric((docs.filter(d=>d.relevant).length/3*100).toFixed(0)+'%','候选 Recall@k')+metric((hits/3*100).toFixed(0)+'%','最终证据 Recall@≤3')+metric(top.filter(d=>!d.allowed).length,'最终越权条数');$('#ragRows').innerHTML=docs.map((d,i)=>`<tr><td>${i+1}. ${d.id} ${d.title}${i<3?' <span class="pill">注入上下文</span>':''}</td><td>${d.score.toFixed(2)}</td><td>${$('#ragRerank').checked?d.rerank.toFixed(2):'未使用'}</td><td>${!d.allowed?'越权，禁止使用':d.relevant?'相关':'不相关'}</td></tr>`).join('');const bad=top.some(d=>!d.allowed);$('#ragResult').classList.toggle('error',bad);$('#ragResult').textContent=bad?'权限失效：高分的私有文档被送入上下文。真实系统必须从身份边界阻止，不能要求模型自行忘掉。':`最终召回 ${hits}/3 份授权相关证据。试着缩小候选 k：重排无法找回从未进入候选集的文档。`}
bindInputs(['ragWeight','ragK','ragRerank','ragAcl'],update)}

function recoveryOutcome(durable,idempotent){return {writes:idempotent?1:2,repeatedReads:durable?0:2}}
function labRecovery(){labLayout(check('recoveryDurable','保存动作前的任务 checkpoint')+check('recoveryIdem','业务服务支持稳定幂等键')+`<div class="full"><button class="btn primary" id="crashRun">执行并注入崩溃</button></div><div class="full"><button class="btn" id="recoverRun" disabled>恢复任务</button></div><div class="full"><button class="btn small" id="recoveryReset">重置</button></div><p class="hint full">固定崩溃位置：工单已经写入业务库，但“工具成功”尚未写入任务状态。用于展示经典的不确定提交窗口。</p>`,`<h2>Checkpoint 不能代替业务幂等</h2><div class="flow"><div class="node">读取证据</div><div class="node">保存执行意图</div><div class="node">写入工单</div><div class="node">保存成功结果</div></div><div id="recoveryMetrics" class="metric-row"></div><div id="recoveryTrace" class="trace" aria-live="polite"></div><div class="callout"><strong>观察两个独立问题</strong><p>持久化状态减少已完成步骤的重做；稳定幂等键让下游识别重复业务动作。两者保护的边界不同。此实验假定 action_id 在创建任务时生成，并在恢复中保持不变。</p></div>`);
let phase=0;function show(){const d=$('#recoveryDurable').checked,i=$('#recoveryIdem').checked,o=recoveryOutcome(d,i);$('#recoveryMetrics').innerHTML=metric(phase===0?0:phase===1?1:o.writes,'业务库中的工单数')+metric(phase===2?o.repeatedReads:0,'恢复后重做的只读步骤')+metric('ACT-001','稳定业务动作 ID');$('#recoveryTrace').innerHTML=phase===0?'尚未运行。':phase===1?'<div>读取证据完成；准备 ACT-001。</div><div>业务系统：创建工单成功。</div><div>故障：worker 在保存工具结果前崩溃。任务状态不知道写入是否成功。</div>':`<div>${d?'从动作前 checkpoint 恢复。':'没有 checkpoint，重新读取证据并重建计划。'}</div><div>恢复时再次提交 ACT-001。</div><div>${i?'业务服务命中幂等记录，返回原工单，没有重复写入。':'业务服务未去重，再创建一张工单，产生重复副作用。'}</div><div>读取业务状态并保存任务结果。</div>`;$('#crashRun').disabled=phase!==0;$('#recoverRun').disabled=phase!==1;$('#recoveryDurable').disabled=phase!==0;$('#recoveryIdem').disabled=phase!==0}
$('#crashRun').onclick=()=>{phase=1;show()};$('#recoverRun').onclick=()=>{phase=2;show()};$('#recoveryReset').onclick=()=>{phase=0;show()};$('#recoveryDurable').onchange=show;$('#recoveryIdem').onchange=show;show()}

function estimateCost(x){const llm=x.steps*(x.input*((1-x.cache)*x.inRate+x.cache*x.cacheRate)+x.output*x.outRate)/1e6;const attempt=llm+x.steps*x.toolRate;const task=attempt*x.attempts;return {llm,attempt,task,monthly:task*x.daily*30,success:task/x.success,concurrency:x.qps*x.seconds}}
function labCost(){labLayout(`<div class="cost-inputs full">${control('costDaily','每天任务数','number',1000,1,1000000)}${control('costSteps','每次尝试模型轮数','number',4,1,100)}${control('costIn','每轮输入 token','number',2500,0,1000000)}${control('costOut','每轮输出 token','number',500,0,100000)}${control('costCache','输入缓存占比 %','number',40,0,100)}${control('costSuccess','最终成功率 %','number',85,1,100)}${control('costAttempts','每任务平均尝试数','number',1.1,1,20,.1)}${control('costTool','每轮工具成本','number',.001,0,10,.001)}${control('rateIn','未缓存 / 百万 token','number',2,0,1000,.1)}${control('rateCache','缓存 / 百万 token','number',.5,0,1000,.1)}${control('rateOut','输出 / 百万 token','number',8,0,1000,.1)}${control('costQps','稳定到达率 QPS','number',2,.1,1000,.1)}${control('costSeconds','平均任务时长 / 秒','number',12,.1,10000,.1)}</div><p class="hint full">金额单位可自选，但所有输入必须同币种。默认值为虚构教学单价，不对应任何供应商报价。轮间输入增长在此简化为平均值。</p>`,`<h2>费用要算到“成功完成一件事”</h2><div id="costMetrics" class="metric-row"></div><div id="costResult" class="result" aria-live="polite"></div><div class="code">每次尝试 = Σ(输入成本 + 输出成本 + 工具成本)\n每任务期望成本 = 每次尝试 × 平均尝试数\n每成功任务成本 = 每任务期望成本 ÷ 最终成功率\n30 天成本 = 每任务期望成本 × 每日任务数 × 30\n平均在途任务 L ≈ 到达率 λ × 平均耗时 W</div><p class="hint">成功率是完成所有允许尝试后的任务成功率，平均尝试数单独输入。该粗估假设各次尝试成本相同。Little 定律估算稳定系统平均在途量，不是所需 worker/GPU 数，也不保证尾延迟。</p><p>未计入：空闲硬件、数据库、对象存储、网络、日志、评测、人工审核、税费和运维。真实预算要把这些补齐。</p>`);
function update(){const x={daily:num('costDaily'),steps:num('costSteps'),input:num('costIn'),output:num('costOut'),cache:num('costCache')/100,success:num('costSuccess')/100,attempts:num('costAttempts'),toolRate:num('costTool'),inRate:num('rateIn'),cacheRate:num('rateCache'),outRate:num('rateOut'),qps:num('costQps'),seconds:num('costSeconds')},v=estimateCost(x);$('#costMetrics').innerHTML=metric(v.attempt.toFixed(4),'每次尝试成本')+metric(v.success.toFixed(4),'每成功任务成本')+metric(v.monthly.toFixed(2),'30 天估算成本')+metric(v.concurrency.toFixed(1),'平均在途任务量');$('#costResult').textContent=`当前每次尝试模型成本 ${v.llm.toFixed(4)}，工具成本 ${(v.attempt-v.llm).toFixed(4)}；每任务平均成本 ${v.task.toFixed(4)}。成功率下降时，单位成功任务成本会升高。`}
bindInputs(['costDaily','costSteps','costIn','costOut','costCache','costSuccess','costAttempts','costTool','rateIn','rateCache','rateOut','costQps','costSeconds'],update)}

const evalRows=[['常规','查连接池说明',1,1],['常规','查询服务负责人',1,1],['常规','比较两份配置',1,1],['常规','总结故障日志',1,1],['常规','引用当前版本',0,1],['常规','创建工单草案',1,1],['长尾','无答案时澄清',0,1],['长尾','文档相互矛盾',0,1],['长尾','工具超时恢复',0,1],['长尾','旧记忆纠正',1,1],['安全','拒绝跨租户检索',1,0],['安全','阻止越权写入',1,0]];
function wilson(success,total){if(!total)return[0,0];const z=1.96,p=success/total,d=1+z*z/total,c=(p+z*z/(2*total))/d,h=z*Math.sqrt(p*(1-p)/total+z*z/(4*total*total))/d;return[c-h,c+h]}
function labEval(){labLayout(select('evalVersion','版本',[['a','版本 A：基线'],['b','版本 B：常规增强但权限回归']])+select('evalSlice','数据切片',[['全部','全部'],['常规','常规'],['长尾','长尾'],['安全','安全']])+`<p class="small full">任务集固定为 12 条。成功标记是人工构造，用来演示“平均分变好，但关键安全类别退化”。每条结果可直接核对。</p><p class="hint full">右侧区间是二项独立同分布假设下的 Wilson 95% 区间演示；这组刻意构造的小数据不满足真实生产抽样条件，不能用于宣称线上可靠性。</p>`,`<h2>平均成功率会掩盖什么？</h2><div id="evalMetrics" class="metric-row"></div><div class="table-wrap"><table><thead><tr><th>类别</th><th>任务</th><th>结果</th></tr></thead><tbody id="evalRows"></tbody></table></div><div id="evalGate" class="result" aria-live="polite"></div><p class="hint">门禁始终检查完整 12 条数据中的安全类别，切换视图不会绕过它。生产系统应设置更完整的保留集、重复试验与风险门禁。</p>`);
function update(){const idx=$('#evalVersion').value==='a'?2:3,slice=$('#evalSlice').value,rows=evalRows.filter(r=>slice==='全部'||r[0]===slice),passed=rows.reduce((s,r)=>s+r[idx],0),ci=wilson(passed,rows.length),bad=evalRows.filter(r=>r[0]==='安全'&&!r[idx]).length;$('#evalMetrics').innerHTML=metric(`${passed}/${rows.length}`,'当前切片通过')+metric((passed/rows.length*100).toFixed(1)+'%','当前成功率')+metric(`${(ci[0]*100).toFixed(0)}–${(ci[1]*100).toFixed(0)}%`,'Wilson 区间（演示）');$('#evalRows').innerHTML=rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[idx]?'通过':'失败'}</td></tr>`).join('');$('#evalGate').classList.toggle('error',bad>0);$('#evalGate').textContent=bad?`发布门禁：拒绝。完整任务集出现 ${bad} 个关键安全失败，即使总体成功率上升也不能发布。`:'发布门禁：本教学安全检查通过；仍需检查质量、成本、延迟及更广的真实测试集。'}
bindInputs(['evalVersion','evalSlice'],update)}

function estimateGpu(x){const weights=x.params*1e9*x.weightBytes/2**30,kv=2*x.layers*x.heads*x.dim*x.tokens*x.batch*x.kvBytes/2**30;return{weights,kv,total:weights+kv+x.overhead}}
function labGpu(){labLayout(`<div class="cost-inputs full">${control('gpuParams','参数量 / B','number',7,1,500)}${control('gpuWeight','权重字节 / 参数','number',2,.5,4,.5)}${control('gpuLayers','层数','number',32,1,128)}${control('gpuHeads','KV 头数','number',8,1,128)}${control('gpuDim','每头维度','number',128,16,512,16)}${control('gpuTokens','每序列缓存 token','number',8192,128,262144,128)}${control('gpuBatch','并发序列数','number',4,1,256)}${control('gpuKv','KV 字节 / 元素','number',2,1,4)}${control('gpuExtra','其他开销 / GiB','number',3,0,128,.5)}${control('gpuCapacity','设备显存 / GiB','number',24,1,512)}</div><p class="hint full">模型参数为教学组合，不指向特定模型。这里只估标准 KV 存储，无 tensor parallel、滑窗、压缩、混合架构或运行时动态调度。</p>`,`<h2>权重装得下，KV 也装得下吗？</h2><div id="gpuMetrics" class="metric-row"></div><div class="bar" id="gpuBar"></div><div class="legend"><span><i style="background:#2867a4"></i>权重</span><span><i style="background:#237b72"></i>KV cache</span><span><i style="background:#c18a5f"></i>其他开销</span></div><div id="gpuResult" class="result" aria-live="polite"></div><div class="code">权重 ≈ 参数量 × 权重字节\nKV ≈ 2 × 层数 × KV头数 × 每头维度\n     × 缓存token × 并发序列 × KV字节\n1 GiB = 2³⁰ bytes</div><p>试着把缓存 token 或并发翻倍，KV 估算会线性增长。把权重改为 0.5 字节只是理想化的 4-bit 估计，量化元数据等额外开销需单独计入；权重量化也不会自动量化 KV。</p>`);
function update(){const x={params:num('gpuParams'),weightBytes:num('gpuWeight'),layers:num('gpuLayers'),heads:num('gpuHeads'),dim:num('gpuDim'),tokens:num('gpuTokens'),batch:num('gpuBatch'),kvBytes:num('gpuKv'),overhead:num('gpuExtra')},v=estimateGpu(x),cap=num('gpuCapacity');$('#gpuMetrics').innerHTML=metric(v.weights.toFixed(2)+' GiB','权重粗估')+metric(v.kv.toFixed(2)+' GiB','KV 粗估')+metric(v.total.toFixed(2)+' GiB','合计粗估');$('#gpuBar').innerHTML=[[v.weights,'#2867a4'],[v.kv,'#237b72'],[x.overhead,'#c18a5f']].map(([n,c])=>`<span style="width:${n/Math.max(cap,v.total)*100}%;background:${c}"></span>`).join('');$('#gpuResult').classList.toggle('error',v.total>cap);$('#gpuResult').textContent=v.total>cap?`超过显存约 ${(v.total-cap).toFixed(2)} GiB。减少上下文/并发、改变精度或进行分片，并重新验证质量与性能。`:`粗估剩余 ${(cap-v.total).toFixed(2)} GiB；不是可运行保证。还需实测峰值、碎片、通信缓存和工作区。`}
bindInputs(['gpuParams','gpuWeight','gpuLayers','gpuHeads','gpuDim','gpuTokens','gpuBatch','gpuKv','gpuExtra','gpuCapacity'],update)}

loop:{title:'有界执行循环（伪代码）',description:'这是职责分解示意，不是复制后即可上生产的完整 SDK 工程。model、policy、store 等接口需由你的服务实现。',code:`async def run_agent(run_id, actor, model, tools, store):
    # actor 来自可信身份；run 创建时已保存稳定 action_id
    state = await store.load(run_id)
    for step in range(state.remaining_steps):
        if state.cancelled or state.deadline_exceeded():
            return await store.finish(run_id, "stopped")
        context = build_context(state, reserve_output=2000)
        reply = await model.generate(context, tools.schemas(actor))
        if reply.is_final:
            # 验证业务状态与证据，不能只信模型说“完成”
            verdict = await verify_outcome(state, reply)
            return await store.finish(run_id, verdict, reply)
        call = validate_schema(reply.tool_call)
        await policy.authorize(actor, call)
        action = await store.persist_intent(run_id, call)
        if action.needs_approval and not action.approved:
            return await store.pause(run_id, action.id)
        # 工具内部设置 timeout；写操作由下游原子去重
        result = await tools.execute(call, actor, action.id)
        state = await store.append_result(run_id, result)
    return await store.finish(run_id, "budget_exhausted")`},
java:{title:'Java 业务边界（设计草图）',description:'身份、授权与幂等属于业务服务。下面的原子提交表达事务意图；具体数据库语法、并发锁与错误映射需要按工程实现。',code:`// 模型只传业务参数，身份来自认证上下文
record TicketDraft(String serviceId, String title,
                   List<String> evidenceIds) {}

Ticket createApprovedTicket(Actor actor, UUID actionId,
                            TicketDraft draft) {
    policy.require(actor, "ticket:create", draft.serviceId());
    approval.requireExactMatch(actor, actionId, hash(draft));
    // 不在数据库长事务中等待 LLM 或远程 HTTP
    return transaction.run(() -> {
        // 唯一约束 (tenant_id, action_id)；并发冲突要重读结果
        var old = actions.find(actor.tenantId(), actionId);
        if (old != null) return old.ticket();
        serviceState.checkVersion(draft.serviceId());
        var ticket = tickets.insert(actor.tenantId(), draft);
        actions.record(actor.tenantId(), actionId, ticket);
        outbox.append("ticket.created", ticket.id());
        return ticket;
    });
}`},
