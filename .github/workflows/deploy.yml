name: Deploy Agent Handbook to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Read Pages URL
        id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm run check:diagrams
      - name: Build for the configured Pages path
        run: npm run build
        env:
          VITEPRESS_BASE: ${{ steps.pages.outputs.base_path }}
      - name: Verify generated links
        run: node verify-static.mjs
        env:
          VITEPRESS_BASE: ${{ steps.pages.outputs.base_path }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
